function chart(pts){
  if(pts.length<2)return'<div class="empty">Мало данных</div>';

function bestSlots(kind){
  const B=D.best_times||{},R=B.rules||{short_hours:[10,16],long_hours:[19],max_shorts_per_day:2,min_gap_hours:6,min_lead_hours:2,horizon_days:3,near_best_ratio:.85},heat=B.heat||{};
  const hours=kind==="long"?R.long_hours:R.short_hours, now=Date.now();
  const taken=[...(D.taken||[]).map(x=>({t:new Date(x.at).getTime(),kind:x.kind||"short"})),...(D.plan||[]).filter(p=>p.title).map(p=>({t:new Date(p.date+"T"+p.time+":00").getTime(),kind:p.what==="кино-разбор"?"long":"short"}))];
  // поправка по нашим роликам: средние просмотры Shorts, вышедших в этот слот (±2 ч), если таких ≥4
  const pub=D.videos.filter(v=>v.privacy==="public"&&v.published&&(v.duration||0)<=180);const FA=fmtAvg();
  const rel=v=>{const a=(FA[v.format]||{}).views;return a?(v.views||0)/a:null};
  const samples=h=>pub.filter(v=>Math.abs(new Date(v.published).getHours()-h)<=1).map(rel).filter(x=>x!=null);
  const own={};const xh=kind==="long"?[]:(R.explore_hours||[]);
  [...hours,...xh].forEach(h=>{const a=samples(h);own[h]=a.length>=(R.explore_min_samples||4)?Math.max(.8,Math.min(1.25,avg(a))):1});
  const c=[];
  for(let d=0;d<=R.horizon_days;d++)for(const h of [...hours,...xh]){const explore=!hours.includes(h);
    const x=new Date();x.setDate(x.getDate()+d);x.setHours(h,0,0,0);const t=x.getTime();
    if(t<now+R.min_lead_hours*36e5)continue;
    const sameDay=taken.filter(y=>new Date(y.t).toDateString()===x.toDateString()&&y.kind!=="long");
    if(kind!=="long"&&sameDay.length>=R.max_shorts_per_day)continue;
    if(taken.some(y=>Math.abs(y.t-t)<R.min_gap_hours*36e5))continue;
    const dow=((x.getDay()+6)%7)+1, v=((heat[dow]||[])[h]||5000)*own[h];
    c.push({t,score:v,dow,explore,h});
  }
  const xs=c.filter(x=>x.explore);const main=c.filter(x=>!x.explore);
  if(!main.length&&!xs.length)return{best:null,list:[]};
  // нужен ли тест времени: в каком-то тестовом часу мало данных и за 7 дней тестов было меньше нормы
  const weekAgo=Date.now()-7*864e5;
  const testsThisWeek=[...pub.filter(v=>new Date(v.published).getTime()>weekAgo).map(v=>new Date(v.published).getHours()),...taken.filter(y=>y.t>weekAgo).map(y=>new Date(y.t).getHours())].filter(h=>xh.includes(h)).length;
  const needTest=xh.filter(h=>samples(h).length<(R.explore_min_samples||4)).length>0&&testsThisWeek<(R.explore_per_week||2);
  return pickBest(main.length?main:xs,xs,needTest,R);
}
function pickBest(c,xs,needTest,R){
  const now=Date.now();
  const top=Math.max(...c.map(x=>x.score));
  const win=c.filter(x=>x.t<=now+(R.pick_window_hours||48)*36e5), pool=win.length?win:c, ptop=Math.max(...pool.map(x=>x.score));
  let best=pool.find(x=>x.score>=ptop*(R.near_best_ratio||.85));

  if(needTest&&xwin.length)best=xwin[0];
  const list=[...new Map([...c,...xs].map(x=>[x.t,x])).values()].sort((a,b)=>a.t-b.t).slice(0,8);
  return{best,list,top:Math.max(top,...xs.map(x=>x.score)),needTest};

function okHint(){

/* ---------- 3D в шапке «Обзора» ---------- */
let gl=null;
let FONT=null;
function buildLogo(THREE,font){
  const G=new THREE.Group();
  const grad=(geo,c1,c2,c3)=>{geo.computeBoundingBox();const b=geo.boundingBox,pos=geo.attributes.position,col=new Float32Array(pos.count*3);const A=new THREE.Color(c1).convertSRGBToLinear(),B=new THREE.Color(c2).convertSRGBToLinear(),C=new THREE.Color(c3).convertSRGBToLinear(),t=new THREE.Color();
    for(let i=0;i<pos.count;i++){const k=(pos.getX(i)-b.min.x)/(b.max.x-b.min.x||1)*.85+(pos.getY(i)-b.min.y)/(b.max.y-b.min.y||1)*.15;if(k<.5)t.copy(A).lerp(B,k*2);else t.copy(B).lerp(C,(k-.5)*2);col[i*3]=t.r;col[i*3+1]=t.g;col[i*3+2]=t.b}
    geo.setAttribute("color",new THREE.BufferAttribute(col,3));return geo};
  const txt=(s,size,h,bev)=>{const g=new THREE.TextGeometry(s,{font,size,height:h,curveSegments:8,bevelEnabled:true,bevelThickness:bev,bevelSize:bev*.6,bevelSegments:4});g.center();return g};
  G.add(new THREE.Mesh(grad(txt("M1lash",1,.42,.09),0x4f8bff,0x9b6bff,0xff4f9a),new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.3,metalness:.05,clearcoat:.8,clearcoatRoughness:.12})));
  const sub=new THREE.Mesh(grad(txt("S T U D I O",.27,.12,.025),0x7fb0ff,0xb79bff,0xff8cc4),new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.3,clearcoat:.8}));sub.position.set(.55,-.92,.1);G.add(sub);
  return G;
}
async function hero3d(){
  const cv=$("#c3d"); if(!cv||!window.THREE)return;
  if(gl)gl.stop();
  try{if(!FONT)FONT=new THREE.Font(await (await fetch("i/font.json")).json())}catch(e){return}
  if(!cv.isConnected)return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let R;try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,powerPreference:"low-power"})}catch(e){return}
  R.setPixelRatio(Math.min(2,devicePixelRatio));R.outputEncoding=THREE.sRGBEncoding;
  const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(30,1,.1,50);
  S.add(new THREE.HemisphereLight(0xffffff,0x2a1440,.28));const k=new THREE.DirectionalLight(0xffffff,.75);k.position.set(3,5,7);S.add(k);
  const p1=new THREE.PointLight(0xff5fa8,.9,30);p1.position.set(-5,-2,4);S.add(p1);const p2=new THREE.PointLight(0x5e95ff,.9,30);p2.position.set(5,2,4);S.add(p2);
  const logo=buildLogo(THREE,FONT);S.add(logo);
  const gm=c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.25,clearcoat:1,clearcoatRoughness:.1});
  const orbs=[[.16,0xff5fa8,0],[.12,0x5e95ff,2.1],[.09,0xffc23d,4.2]].map(([r,c,ph])=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,32,32),gm(c));o.userData.ph=ph;S.add(o);return o});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,.018,12,160),gm(0xc8b5ff));ring.rotation.x=1.35;S.add(ring);
  let tx=0,ty=0,cx=0,cy=0,run=true,drag=null,spin=0,vel=0;
  const mv=e=>{if(drag==null){tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5}};
  const or=e=>{if(e.gamma!=null){tx=Math.max(-.5,Math.min(.5,e.gamma/45));ty=Math.max(-.5,Math.min(.5,(e.beta-45)/60))}};
  const down=e=>{drag=e.clientX;vel=0};const move=e=>{if(drag!=null){const d=(e.clientX-drag)/120;spin+=d;vel=d;drag=e.clientX}};const up=()=>{drag=null};
  cv.addEventListener("pointerdown",down);addEventListener("pointermove",move,{passive:true});addEventListener("pointerup",up);
  addEventListener("pointermove",mv,{passive:true});addEventListener("deviceorientation",or,{passive:true});
  const size=()=>{const w=cv.clientWidth,h=cv.clientHeight;if(!w)return;R.setSize(w,h,false);C.aspect=w/h;C.position.set(0,0,Math.max(5.2,9.5/C.aspect+2.6));C.updateProjectionMatrix()};size();
  const ro=new ResizeObserver(size);ro.observe(cv);
  const loop=t=>{if(!run)return;t*=.001;cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;if(drag==null){vel*=.94;spin+=vel;spin*=.96}
    logo.rotation.set(.1+cy*.5+Math.sin(t*.7)*.04,-.25+cx*.9+spin+Math.sin(t*.5)*.12,0);logo.position.y=Math.sin(t*1.1)*.06;
    orbs.forEach((o,i)=>{const a=t*(.7+i*.15)+o.userData.ph;o.position.set(Math.cos(a)*2.6,Math.sin(a)*.55,Math.sin(a)*1.4)});ring.rotation.z=t*.12;
    R.render(S,C);if(!reduce&&!document.hidden)requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
  const vis=()=>{if(!document.hidden&&run&&!reduce)requestAnimationFrame(loop)};document.addEventListener("visibilitychange",vis);
  gl={stop(){run=false;ro.disconnect();removeEventListener("pointermove",mv);removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("deviceorientation",or);document.removeEventListener("visibilitychange",vis);R.dispose()}};
}
/* ---------- секреты GitHub: шифрование в браузере (sealed box) ---------- */
let cryptoP=null;
function loadCrypto(){return cryptoP||(cryptoP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="i/m1crypto.js";s.onload=()=>res(window.M1Crypto);s.onerror=()=>rej(new Error("не загрузилось шифрование"));document.head.appendChild(s)}))}
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));const b64u8=a=>{let s="";a.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
async function setSecret(name,value){
  const C=await loadCrypto();const pk=await gh("/actions/secrets/public-key");
  const enc=C.seal(new TextEncoder().encode(value),u8(pk.key));
  await gh("/actions/secrets/"+name,{method:"PUT",body:JSON.stringify({encrypted_value:b64u8(enc),key_id:pk.key_id})});
}
async function secretExists(name){try{await gh("/actions/secrets/"+name);return true}catch(e){if(/404/.test(e.message))return false;throw e}}
const klog=m=>{const e=$("#keyLog");if(e)e.textContent=m};
async function makeSigningKey(btn){
  if(await secretExists("WIDGET_KEYSTORE_B64")&&btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.disabled=false;btn.textContent="Ключ уже есть — всё равно заменить?";klog("Внимание: новый ключ = виджет придётся один раз переустановить.");return}
  klog("Создаю ключ RSA-2048… (10–30 секунд)");const C=await loadCrypto(),F=C.forge;
  const kp=await new Promise((res,rej)=>F.pki.rsa.generateKeyPair({bits:2048,workers:-1},(e,k)=>e?rej(e):res(k)));
  const c=F.pki.createCertificate();c.publicKey=kp.publicKey;c.serialNumber="01"+Date.now().toString(16);c.validity.notBefore=new Date();c.validity.notAfter=new Date(Date.now()+30*365*864e5);
  const at=[{name:"commonName",value:"M1lash Widget"}];c.setSubject(at);c.setIssuer(at);c.sign(kp.privateKey,F.md.sha256.create());
  const pass=b64u8(crypto.getRandomValues(new Uint8Array(24))).replace(/[^A-Za-z0-9]/g,"").slice(0,28);
  const p12=F.pkcs12.toPkcs12Asn1(kp.privateKey,[c],pass,{algorithm:"aes256",friendlyName:"m1lash"});
  const b64=F.util.encode64(F.asn1.toDer(p12).getBytes());
  klog("Шифрую и сохраняю в секреты GitHub…");
  await setSecret("WIDGET_KEYSTORE_B64",b64);await setSecret("WIDGET_KEYSTORE_PASSWORD",pass);
  await dispatch("android-widget.yml");klog("Готово ✓ Ключ сохранён, виджет собирается (~5 мин). Потом удали старый виджет и поставь новый с сайта — дальше обновления пойдут поверх.");
  toast("Ключ подписи создан ✓");btn.textContent="Готово ✓";
}
