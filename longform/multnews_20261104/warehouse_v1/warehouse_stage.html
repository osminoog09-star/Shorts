<script>
'use strict';
// New original SVG scene. Deterministic, functional action not a single static illustration.

const rect=(x,y,w,h,fill,stroke=ink,sw=6,rad=3)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rad}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;

 s+=path('M0 0L520 -93L2600 20V170L0 128Z','#576c7f',ink,17);
 for(let i=0;i<15;i++){let x=10+i*188;s+=line(x,0,x+175,233,'#3f5c71',14)+line(x+180,12,x,205,'#718b95',10)+rect(x,0,25,920,'#8ca2aa',ink,5)}
 for(let y of [164,355,603])s+=line(0,y,2600,y+19,'#60778a',18);
 for(let j=0;j<13;j++){let x=70+j*193;s+=line(x,170,x,280,'#3e5467',5)+path(`M${x-57} 280Q${x} 221 ${x+57} 280Z`,'#f5be58',ink,6)+circ(x,285,39,9,'#fff5c7','none',0)}
 // Three independent mezzanines with handrails and worker activity silhouettes.
 s+=rect(0,421,2600,28,'#ecc04b',ink,7);for(let x=20;x<2600;x+=104)s+=line(x,327,x,420,'#e3b74d',9);s+=line(0,327,2600,327,'#f4d469',12);
 for(let i=0;i<9;i++){let x=250+i*250;s+=group(x,418,.45,workerShape(i,t))}

  for(let row=0;row<4;row++){let y=415+row*127;s+=rect(x, y, 190,15,'#e9c15e',ink,4);let n=col*4+row;

 for(let j=0;j<5;j++)s+=line(0,980+j*113,2600,925+j*140,'#94a6ad',3);
 s+=path('M1000 900L1252 900L1990 1462H1460Z','#869ba9','none',0);

 for(let i=0;i<10;i++){let x=1260+i*70;let y=1150+i*30;s+=line(x,y,x+34,y,'#f3d47a',8)}

function loadingDock(t){let s='';
 s+=rect(75,480,1110,512,'#51667d',ink,14,16)+rect(115,513,1032,446,'#344b60',ink,8,4);
 // Box depth recedes into the trailer: visible rear supports, not a wall of tiles.
 s+=rect(132,540,1000,386,'#627a86','none',0);
 for(let row=0;row<4;row++)for(let col=0;col<7;col++){
  let x=183+col*126+(row%2)*12,y=568+row*93;

 }

 return s;

function belt(t){let s='';s+=path('M1360 1056L2400 1056L2520 1190L1460 1210Z','#4d7285',ink,11);
 s+=path('M1400 1075L2368 1075L2450 1151L1480 1171Z','#95c7c5',ink,8);
 for(let i=0;i<17;i++){let x=1452+i*58;s+=line(x,1085,x+38,1163,'#6f9b9c',8)}

 s+=rect(2126,959,17,222,'#365e78',ink,7,4)+rect(2068,951,150,23,'#365e78',ink,6,5);

function stretchRobot(t){
 const approach=smooth((t-4.0)/1.30);
 const lift=smooth((t-5.30)/1.80);
 const across=smooth((t-7.10)/2.50);
 const down=smooth((t-9.60)/1.50);
 const release=t>=11.10;
 const headX=mix(1200,970,approach)+across*600;
 const headY=mix(600,816,approach)-lift*200+down*344;
 const cargoX=release? 1515 +Math.max(0,t-11.1)*210: headX-55;
 const cargoY=release? 964: headY+4;
 const botBase=[1312,1138];
 const elbow=[mix(botBase[0]-26,headX,0.38),mix(botBase[1]-255,headY-100,.4)];
 let s='';
 // Mobile robot base, realistic weight and working zone; no imitation of specific branded robot.
 s+=circ(botBase[0],1170,212,34,'#24374f','none',0);
 s+=rect(botBase[0]-154,1046,318,105,'#45879d',ink,11,46)+rect(botBase[0]-112,1002,242,50,'#e7c451',ink,8,12);
 s+=circ(botBase[0]-108,1143,39,39,'#354358',ink,7)+circ(botBase[0]+98,1143,39,39,'#354358',ink,7);
 s+=rect(botBase[0]-99,1074,195,38,'#34566c',ink,4,7)+txt(botBase[0]-77,1102,'РОБОТ',28);
 // Arm moves in two coordinated links: shoulder -> elbow -> vacuum head.
 const armPath=`M${botBase[0]} ${1010}L${elbow[0]} ${elbow[1]}L${headX} ${headY-40}`;
 s+=path(armPath,'none',ink,73)+path(armPath,'none','#efab4b',55);
 s+=circ(botBase[0],1011,57,53,'#e9b453',ink,9)+circ(elbow[0],elbow[1],42,42,'#e7a24c',ink,8);
 s+=line(botBase[0]-18,991,elbow[0]-25,elbow[1]-22,'#4b7b83',7);
 // Vacuum pads are visible above the box: no arbitrary hovering magnet.
 s+=rect(headX-67,headY-46,134,35,'#365d78',ink,8,8)+line(headX-47,headY-10,headX-47,headY+3,'#2b4059',7)+line(headX+47,headY-10,headX+47,headY+3,'#2b4059',7);
 s+=circ(headX-47,headY+3,18,8,'#32495e',ink,4)+circ(headX+47,headY+3,18,8,'#32495e',ink,4);
 // Source pallet and controlled prop motion; exact continuity at 5.3 and 11.1.
 s+=rect(877,912,214,32,'#d1a75a',ink,7,3)+rect(899,945,35,22,'#ad8851',ink,4)+rect(1036,945,35,22,'#ad8851',ink,4);
 if(t<5.3) s+=box(915,820,110,91,'#e0ad70','BOX');
 else if(!release)s+=box(cargoX,cargoY,110,91,'#e0ad70','BOX');
 else s+=box(cargoX,cargoY,110,91,'#e0ad70','BOX');
 if(t>=11.1 && t<11.8)s+=rect(1646,907,266,53,'#3c8b74',ink,6,9)+txt(1662,945,'ГРУЗ НА ЛЕНТЕ',29);
 if(t>=14.2)s+=rect(2094,911,268,52,'#3a8d78',ink,5,8)+txt(2120,948,'ПРОВЕРЕНО',31);
 window.__warehouseQA={time:t,phase:t<4?'establish':t<5.3?'approach':t<7.1?'lift':t<9.6?'carry':t<11.1?'lower':'release',head:[headX,headY],cargo:[cargoX,cargoY],release,gripGap:t>=5.3&&!release?Math.hypot(cargoX+55-headX,cargoY-4-headY):null};
 return s;
}
function hud(t){let title=t<4?'ОГРОМНЫЙ ЛОГИСТИЧЕСКИЙ ЦЕНТР':t<8?'ЗАХВАТ КОРОБКИ':t<12?'ПЕРЕНОС ГРУЗА':'ПОТОК СОРТИРОВКИ';return rect(0,0,1920,94,'#243b55','none',0)+path('M0 0H320L290 90H0Z','#d65260','none',0)+txt(26,67,'M1lash',60)+txt(352,62,'МУЛЬТНОВОСТИ',40,'#f9d67d')+rect(1100,16,800,62,'#345b75',ink,3,9)+txt(1140,61,title,34)+rect(0,1000,1920,80,'#243b55','none',0)+rect(24,1012,1000,54,'#365273','none',0,7)+txt(48,1049,'BOSTON DYNAMICS: STRETCH GEN 2',36)+rect(1600,1011,291,54,'#f2bf59','none',0,8)+txt(1628,1049,'ФАКТ / СКЕТЧ',32,'#243b55');}
const SHOTS=[[0,0,2600,1462],[205,260,1980,1114],[460,300,1800,1012],[900,470,1700,957]];
function camera(t){let shot=t<4?0:t<8?1:t<12?2:3;let b=SHOTS[shot].slice();let u=(t%4)/4;b[0]+=u*21;b[1]+=u*8;return {shot,viewBox:b};}
window.frame=(t,forcedShot=null)=>{
 t=Number(t)||0;const c=camera(t), idx=forcedShot===null?c.shot:forcedShot, box=forcedShot===null?c.viewBox:SHOTS[forcedShot];const stage=document.getElementById('stage');stage.setAttribute('viewBox',box.join(' '));
 const svg=`<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#223952" opacity=".08"/></pattern></defs>`+background(t)+loadingDock(t)+belt(t)+stretchRobot(t)+rect(0,0,W,H,'url(#dots)','none',0);
 stage.innerHTML=svg;document.getElementById('hud').innerHTML=hud(t);return {time:t,shot:idx,viewBox:box};
};window.frame(0);const q=new URLSearchParams(location.search);if(q.get('preview')==='1'){let st=performance.now();function tick(now){window.frame(((now-st)/1000)%16);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></body></html>
