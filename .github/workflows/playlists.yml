name: Playlist sync
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playlist-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Create missing playlists and sort film videos
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: python scripts/playlists_v2.py
      - name: Save playlist IDs
        run: |
          git config user.name playlist-bot
          git config user.email playlist-bot@users.noreply.github.com
          git add publishing/playlists.json
          git diff --cached --quiet && exit 0
          git commit -m "playlists: save IDs"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
