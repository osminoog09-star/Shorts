name: Playlist sync
on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths:
      - 'publishing/playlists.json'
      - 'scripts/playlists_v2.py'
      - 'scripts/render_channel_branding.py'
      - 'publishing/branding/README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playlist-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'pillow>=10,<12'
      - name: Render channel banner 2560x1440
        run: python scripts/render_channel_branding.py
      - name: Create missing playlists and categorize public uploads
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: python scripts/playlists_v2.py
      - name: Save playlist IDs and generated banner even on partial sync failure
        if: always()
        run: |
          set -euo pipefail
          git config user.name playlist-bot
          git config user.email playlist-bot@users.noreply.github.com
          git add publishing/playlists.json
          if [ -f publishing/branding/banner.png ]; then git add publishing/branding/banner.png; fi
          git diff --cached --quiet && exit 0
          git commit -m "playlists: save category IDs and channel banner"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
