name: Heron revision 2 detailed 3D
on:
  push:
    paths: ['.github/workflows/heron_v2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heron-v2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install numpy
          python3 longform/heron-codex/script.py
          python3 longform/heron-codex/prepare_edge_audio.py
          python3 longform/heron-codex/make_native.py
          python3 longform/heron-codex/prepare_v2.py
      - id: matrix
        run: echo "matrix=$(cat longform/heron-codex/v2_matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: heron-v2-assets
          path: |
            longform/heron-codex/audio/[0-9][0-9].wav
            longform/heron-codex/native_*.wav
            longform/heron-codex/timeline*.json
            longform/heron-codex/native.json
          retention-days: 7
  frames:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: heron-v2-assets
          path: longform/heron-codex
      - run: |
          npm ci --prefix longform/heron-codex
          node longform/heron-codex/node_modules/playwright-core/cli.js install --with-deps chromium
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - name: Render detailed exhibit
        env:
          CLIP: ${{ matrix.clip }}
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
          FRAMES: ${{ matrix.frames }}
        run: |
          cd longform/heron-codex
          read FROM TO < <(python3 -c 'import os; n=int(os.environ["FRAMES"]); p=int(os.environ["PART"]); q=int(os.environ["PARTS"]); print((n*p//q)/30,(n*(p+1)//q)/30)')
          FILE=$(printf '%s_%02d.mp4' "$CLIP" "$PART")
          if [ "$CLIP" = main ]; then
            node render.mjs --fps 30 --from "$FROM" --to "$TO" --out "out/$FILE"
          else
            node render.mjs --clip "$CLIP" --fps 30 --from "$FROM" --to "$TO" --out "out/$FILE"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: heron-v2-part-${{ matrix.clip }}-${{ matrix.part }}
          path: longform/heron-codex/out/*.mp4
          retention-days: 7
  finish:
    needs: [prepare, frames]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heron-v2-assets
          path: longform/heron-codex
      - uses: actions/download-artifact@v4
        with:
          pattern: heron-v2-part-*
          merge-multiple: true
          path: longform/heron-codex/v2_shards
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install numpy pillow
          python3 longform/heron-codex/finish_v2.py
          python3 longform/heron-codex/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: heron-v2-final
          path: longform/heron-codex/out/heron_*
          retention-days: 7
      - name: Release preview and store deliveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="heron-v2-${GITHUB_RUN_ID}"
          gh release create "$TAG" longform/heron-codex/out/heron_*.mp4 longform/heron-codex/out/heron_thumbnail.jpg longform/heron-codex/out/heron_qa* longform/heron-codex/out/heron_metadata.json --title 'Heron v2: slower narration, detailed 3D, 10–15 minutes' --notes 'Revision requested by Denis. Actual 10–15 minute narration, detailed metal/wood/stone reconstructions, native portrait Shorts. Technical checks passed; human perception review is separate.'
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,os
          out=Path('longform/heron-codex/out');manifest=[];base='https://github.com/osminoog09-star/Shorts/releases/download/heron-v2-'+os.environ['GITHUB_RUN_ID']+'/'
          Path('videos').mkdir(exist_ok=True)
          for p in out.glob('heron_*.mp4'):
              small=p.stat().st_size<95_000_000
              if small:shutil.copy2(p,Path('videos')/p.name)
              manifest.append({'file':p.name,'bytes':p.stat().st_size,'release_url':base+p.name,'committed_to_videos':small})
          shutil.copy2(out/'heron_thumbnail.jpg','videos/heron_thumbnail_v2.jpg')
          Path('videos/heron_v2_release.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          shutil.copy2(out/'heron_qa.json','longform/heron-codex/EXPORT_QA_V2.json');shutil.copy2(out/'heron_metadata.json','longform/heron-codex/EXPORT_METADATA_V2.json')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/heron*_*v2* videos/heron_v2_release.json longform/heron-codex/EXPORT_QA_V2.json longform/heron-codex/EXPORT_METADATA_V2.json longform/heron-codex/timeline.json
          git diff --cached --quiet && exit 0
          git commit -m 'Deliver Heron v2: detailed exhibits, slower voice and 10–15 minute master'
          for I in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; done
          exit 1
