name: YouTube direct · review then schedule

on:
  # One-time owner-requested private upload trigger: limited to a single reviewed bot3 manifest.
  # Will be removed after the upload attempt; schedule still requires workflow_dispatch.
  push:
    branches: [main]
    paths:
      - 'publishing/private_upload_requests/pretend_bot3_gpt.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: "publishing/queue/<slug>.json (committed to main)"
        required: true
        type: string
      execute:
        description: "FALSE = validate only. TRUE = do it."
        required: true
        default: false
        type: boolean
      mode:
        description: "upload = залить приватно (без publish_at — на просмотр Денису); schedule = назначить дату уже залитому"
        required: true
        default: upload
        type: choice
        options: [upload, schedule]

permissions:
  contents: write

concurrency:
  group: youtube-direct-upload
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || github.actor == 'osminoog09-star'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EFFECTIVE_MANIFEST: ${{ github.event_name == 'push' && 'publishing/queue/pretend_bot3_gpt.json' || inputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal requirements
        run: python -m pip install 'requests>=2.32,<3'
      - name: Guard one-time owner-authorized PRIVATE upload request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('publishing/private_upload_requests/pretend_bot3_gpt.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('publishing/queue/pretend_bot3_gpt.json').read_text(encoding='utf-8'))
          expected = '53dc3cfa971a4081fcecd0ba7fd2c38e6672417fca729328a5e875b489bc86dd'
          if request != {'action': 'private_upload_once', 'manifest': 'publishing/queue/pretend_bot3_gpt.json',
                         'sha256': expected, 'private_only': True}:
              raise SystemExit('NO-GO: private upload request not strictly authorized')
          if manifest.get('publish_at') or manifest.get('channel') != 'ru':
              raise SystemExit('NO-GO: manifest contains a date or wrong channel')
          if manifest.get('source', {}).get('sha256') != expected or manifest.get('source', {}).get('path') != 'videos/pretend_bot3_gpt_ru_v3.mp4':
              raise SystemExit('NO-GO: manifest differs from reviewed V3')
          print('Authorized PRIVATE upload of exact V3 MP4; no schedule.')
          PY
      - name: Validate manifest (NO upload)
        if: github.event_name == 'push' || inputs.mode == 'upload'
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
        run: python scripts/youtube_direct.py check --manifest "$MANIFEST"
      - name: Resolve reviewed MP4 source
        id: source
        if: github.event_name == 'push' || (inputs.execute == true && inputs.mode == 'upload')
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          manifest = json.load(open(os.environ["MANIFEST"], encoding="utf-8"))
          source = manifest["source"]
          if source["type"] == "repo":
              output = pathlib.Path(source["path"]).resolve()
          else:
              output_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "youtube_source"
              output_dir.mkdir(exist_ok=True)
              subprocess.run(["gh", "release", "download", source["tag"],
                              "--repo", os.environ["GITHUB_REPOSITORY"],
                              "--pattern", source["asset"], "--dir", str(output_dir)],
                             check=True)
              output = (output_dir / source["asset"]).resolve()
          if not output.is_file() or output.suffix.lower() != ".mp4":
              raise SystemExit("Reviewed MP4 not found; no upload")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("video_file=" + str(output) + "\n")
          print("MP4 ready, size=%d bytes" % output.stat().st_size)
          PY
      - name: Verify OAuth credentials and channel BEFORE reservation
        if: github.event_name == 'push' || (inputs.execute == true && inputs.mode == 'upload')
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
          VIDEO_FILE: ${{ steps.source.outputs.video_file }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_direct.py preflight --manifest "$MANIFEST" --video-file "$VIDEO_FILE"
      - name: Persist no-retry reservation BEFORE upload
        if: github.event_name == 'push' || (inputs.execute == true && inputs.mode == 'upload')
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube_direct.py reserve --manifest "$MANIFEST"
          RECEIPT="publishing/receipts/$(basename "$MANIFEST")"
          git config user.name youtube-direct-bot
          git config user.email youtube-direct-bot@users.noreply.github.com
          git add "$RECEIPT"
          git commit -m "youtube: reserve upload $(basename "$MANIFEST")"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload to verified YouTube channel (private/scheduled)
        if: github.event_name == 'push' || (inputs.execute == true && inputs.mode == 'upload')
        id: upload
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
          VIDEO_FILE: ${{ steps.source.outputs.video_file }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_direct.py send --manifest "$MANIFEST" --video-file "$VIDEO_FILE"
      - name: Schedule release of the reviewed private video
        if: inputs.execute == true && inputs.mode == 'schedule'
        id: schedule
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_direct.py schedule --manifest "$MANIFEST"
      - name: Persist YouTube ID and URL
        if: steps.upload.outcome == 'success' || steps.schedule.outcome == 'success'
        env:
          MANIFEST: ${{ env.EFFECTIVE_MANIFEST }}
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="publishing/receipts/$(basename "$MANIFEST")"
          git add "$RECEIPT"
          git config user.name youtube-direct-bot
          git config user.email youtube-direct-bot@users.noreply.github.com
          git commit -m "youtube: record ${{ inputs.mode }} $(basename "$MANIFEST")"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep receipt for manual recovery
        if: always() && (github.event_name == 'push' || inputs.execute == true)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-receipt-${{ github.run_id }}
          path: publishing/receipts/
          retention-days: 30
          if-no-files-found: ignore
