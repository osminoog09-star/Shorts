name: TTS

# Озвучка: пушнул jobs/tts/<name>.json -> получил media/tts/<name>/*.mp3 + тайминги слов
on:
  push:
    paths: ["jobs/tts/**.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "edge-tts>=7"
      - name: Synthesize
        run: python scripts/tts_job.py jobs/tts/*.json
      - name: Commit
        run: |
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add media/tts
          git diff --cached --quiet && exit 0
          git commit -m "tts: $(ls jobs/tts | tr '\n' ' ')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
