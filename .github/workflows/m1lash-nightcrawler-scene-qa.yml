name: M1lash private dubbed film scene speech-language QA
on:
  push:
    paths:
      - .github/workflows/m1lash-nightcrawler-scene-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scene-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download only private QA short-source artifact (no movie in git)
        uses: actions/download-artifact@v4
        with:
          name: movie-edit-draft
          run-id: 41226808601
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-source
      - name: Install FFmpeg for reliable audio decoding
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Detect actual spoken language
        run: |
          python3 -m pip install --quiet faster-whisper
          python3 - <<'PY'
          import json, pathlib, hashlib, subprocess, numpy as np
          from faster_whisper import WhisperModel
          d=pathlib.Path('qa-source/originals')
          model=WhisperModel('small',device='cpu',compute_type='int8')
          result=[]
          for p in sorted(d.glob('*.mp4')):
              # Full 31-58s speech detection; metadata language alone is not evidence
              raw=subprocess.check_output(['ffmpeg','-v','error','-i',str(p),'-vn','-ar','16000','-ac','1','-f','f32le','-'])
              wave=np.frombuffer(raw,dtype='<f4')
              s,info=model.transcribe(wave,beam_size=3,language=None,vad_filter=True,condition_on_previous_text=False)
              segments=list(s)
              rows=[{'start':round(x.start,2),'end':round(x.end,2),'text':x.text.strip()} for x in segments]
              rec={'file':p.name,'language':info.language,'prob':round(info.language_probability,5),
                   'segments':rows,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              result.append(rec)
              print(p.name,'SPOKEN_LANGUAGE',rec['language'],'PROB',rec['prob'],'SEGMENTS',len(rows))
          pathlib.Path('spoken_language_qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Save textual ASR QA only
        uses: actions/upload-artifact@v4
        with:
          name: nightcrawler-spoken-language-qa
          path: spoken_language_qa.json
          retention-days: 7
