name: M1lash offline voice lab QA
on:
  push:
    paths: ['tools/voice_lab/**','tests/test_m1lash_voice_lab.py']
  pull_request:
    paths: ['tools/voice_lab/**','tests/test_m1lash_voice_lab.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_m1lash_voice_lab.py -v
