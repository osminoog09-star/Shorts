name: M1lash drawn lab exact Dima voices
on:
  push:
    branches: [codex/drawn-explainers-20261028]
    paths: [.github/workflows/drawn-voices.yml, longform/drawn-lab-20261028/voice.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  voices:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ids: ['4','8','14','27','91','92']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: longform/drawn-lab-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1
      - uses: actions/download-artifact@v4
        with:
          name: m1lash-drawn-all-accepted-voices
          run-id: 40762612570
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: longform/drawn-lab-20261028/build
      - run: python longform/drawn-lab-20261028/voice.py --ids=${{ matrix.ids }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawn-voice-batch-${{ matrix.ids }}
          path: longform/drawn-lab-20261028/build/voice_*
          retention-days: 14
          if-no-files-found: warn
  assemble:
    needs: voices
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: longform/drawn-lab-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1
      - uses: actions/download-artifact@v4
        with:
          name: m1lash-drawn-all-accepted-voices
          run-id: 40762612570
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: longform/drawn-lab-20261028/build
      - uses: actions/download-artifact@v4
        with:
          pattern: drawn-voice-batch-*
          merge-multiple: true
          path: longform/drawn-lab-20261028/build
      - run: python longform/drawn-lab-20261028/voice.py --assemble
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1lash-drawn-all-accepted-voices
          path: longform/drawn-lab-20261028/build/voice_*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m1lash-drawn-measured-timelines
          path: longform/drawn-lab-20261028/build/*timeline.json
          retention-days: 14
