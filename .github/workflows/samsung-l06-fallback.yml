name: Samsung one-line short fallback L06
on:
  push:
    branches: [codex/samsung-long-map-20261027]
    paths: ['.github/workflows/samsung-l06-fallback.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  shortline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/samsung-long-map-20261027}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q "edge-tts>=7,<8"
      - name: Dmitry concise line with standalone input
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          j={"voice":"ru-RU-DmitryNeural","rate":"+0%","pitch":"+0Hz","lines":[{"id":"L06","voice":"ru-RU-DmitryNeural","rate":"+0%","text":"В Австралии Samsung официально продаёт Galaxy. А вот острова Тихого океана проверяем отдельно. Маленькая страна не значит отсутствие магазина!"}]}
          p=pathlib.Path('jobs/tts/samsung_L06_short.json');p.write_text(json.dumps(j,ensure_ascii=False),encoding='utf-8')
          for i in range(3):
              proc=subprocess.run(['timeout','70','python','scripts/tts_job.py',str(p)],capture_output=True,text=True)
              mp3=pathlib.Path('media/tts/samsung_L06_short/L06.mp3')
              if mp3.exists() and mp3.stat().st_size>1400:break
              print('L06 RETRY',i,proc.stdout[-400:],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samsung-L06-short-dmitry-neural
          path: media/tts/samsung_L06_short/
          if-no-files-found: warn
          retention-days: 30
