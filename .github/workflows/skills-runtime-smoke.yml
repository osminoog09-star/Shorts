name: Third-party skill runtime smoke (isolated)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/skills-runtime-smoke.yml
      - tools/skills_runtime_smoke.py

permissions:
  contents: read

concurrency:
  group: skills-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      graphify: ${{ steps.graphify.outcome }}
      scrapling: ${{ steps.scrapling.outcome }}
      watch: ${{ steps.watch.outcome }}
      autoharness: ${{ steps.autoharness.outcome }}
      opuscar_docs: ${{ steps.opuscar_docs.outcome }}
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      WATCH_ALLOW_API: "0"
      GRAPHIFY_BACKEND: "none"
      GRAPHIFY_QUERY_LOG_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup isolated Python dependencies
        continue-on-error: true
        run: |
          python -m venv /tmp/m1lash-skills-venv
          /tmp/m1lash-skills-venv/bin/python -m pip install --no-cache-dir graphifyy scrapling yt-dlp
          /tmp/m1lash-skills-venv/bin/python -m pip show graphifyy scrapling yt-dlp | grep -E '^(Name|Version):'
      - name: Graphify structural graph — local test only, no Cloud or hooks
        id: graphify
        continue-on-error: true
        run: /tmp/m1lash-skills-venv/bin/python tools/skills_runtime_smoke.py graphify
      - name: Scrapling HTML parse — local test only, no anti-bot
        id: scrapling
        continue-on-error: true
        run: /tmp/m1lash-skills-venv/bin/python tools/skills_runtime_smoke.py scrapling
      - name: Claude Watch /watch — synthetic offline MP4
        id: watch
        continue-on-error: true
        run: |
          /tmp/m1lash-skills-venv/bin/python skills/ext/watch/scripts/setup.py --json
          /tmp/m1lash-skills-venv/bin/python tools/skills_runtime_smoke.py watch
      - name: AutoHarness — syntax and isolated tests, no Claude hooks
        id: autoharness
        continue-on-error: true
        run: /tmp/m1lash-skills-venv/bin/python tools/skills_runtime_smoke.py autoharness
      - name: Opuscar + Teardown — style manifest and runtime preflight
        id: opuscar_docs
        continue-on-error: true
        run: /tmp/m1lash-skills-venv/bin/python tools/skills_runtime_smoke.py opuscar

      - name: Aggregate Python smoke verdict
        if: always()
        env:
          GRAPHIFY: ${{ steps.graphify.outcome }}
          SCRAPLING: ${{ steps.scrapling.outcome }}
          WATCH: ${{ steps.watch.outcome }}
          AUTOHARNESS: ${{ steps.autoharness.outcome }}
          OPUSCAR_DOCS: ${{ steps.opuscar_docs.outcome }}
        run: |
          for s in GRAPHIFY SCRAPLING WATCH AUTOHARNESS OPUSCAR_DOCS; do
            echo "$s: ${!s}"
            if [[ "${!s}" != success ]]; then failed=1; fi
          done
          if [[ "${failed:-0}" == 1 ]]; then exit 1; fi

  colibri:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Clone official Colibri sources (no model downloads)
        run: git clone --depth 1 https://github.com/JustVugg/colibri.git /tmp/colibri
      - name: CPU-only compile
        run: make -C /tmp/colibri/c -j2 colibri
      - name: Binary inspection and --help
        run: |
          file /tmp/colibri/c/colibri
          test -x /tmp/colibri/c/colibri
          timeout 30 /tmp/colibri/c/colibri --help | head -35

  opuscar-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clone official Opuscar engine (outside M1lash checkout)
        run: git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git /tmp/lemo-runtime
      - name: Install Opuscar core dependencies (no voices, models or music)
        run: |
          cd /tmp/lemo-runtime
          sh scripts/setup.sh deps
      - name: Import Playwright and check renderer directories
        run: |
          cd /tmp/lemo-runtime
          node -e "require('playwright-core'); console.log('PLAYWRIGHT_CORE_PASS')"
          test -d core/render
          test -x .venv/bin/python
          .venv/bin/python --version
          echo "OPUSCAR CORE DEPENDENCIES PASS — sample render still not tested"

  openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install OpenClaw to disposable prefix (no launch, no secrets)
        run: |
          mkdir -p /tmp/m1lash-openclaw
          npm install --prefix /tmp/m1lash-openclaw --no-audit --no-fund --ignore-scripts openclaw@latest
          npm ls --prefix /tmp/m1lash-openclaw openclaw --depth=0
      - name: CLI preflight without daemon onboarding
        run: |
          node -v
          timeout 35 /tmp/m1lash-openclaw/node_modules/.bin/openclaw --help | head -60

  publish-summary:
    if: always()
    needs: [python-skills, colibri, opuscar-runtime, openclaw]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHON_RESULT: ${{ needs['python-skills'].result }}
      GRAPHIFY_RESULT: ${{ needs['python-skills'].outputs.graphify }}
      SCRAPLING_RESULT: ${{ needs['python-skills'].outputs.scrapling }}
      WATCH_RESULT: ${{ needs['python-skills'].outputs.watch }}
      AUTOHARNESS_RESULT: ${{ needs['python-skills'].outputs.autoharness }}
      OPUSCAR_DOCS_RESULT: ${{ needs['python-skills'].outputs.opuscar_docs }}
      COLIBRI_RESULT: ${{ needs.colibri.result }}
      OPUSCAR_RESULT: ${{ needs['opuscar-runtime'].result }}
      OPENCLAW_RESULT: ${{ needs.openclaw.result }}
    steps:
      - name: Create machine-readable result with exact workflow run ID
        run: |
          python3 - <<'PY'
          import json, os
          d = dict(
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              head_sha=os.environ["GITHUB_SHA"],
              run_url=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              scope="disposable_runner_only; not installed on user's computer",
              python_skills=os.environ["PYTHON_RESULT"],
              python_details={
                  "graphify": os.environ["GRAPHIFY_RESULT"],
                  "scrapling": os.environ["SCRAPLING_RESULT"],
                  "watch": os.environ["WATCH_RESULT"],
                  "autoharness_syntax": os.environ["AUTOHARNESS_RESULT"],
                  "opuscar_style_manifest": os.environ["OPUSCAR_DOCS_RESULT"],
              },
              colibri=os.environ["COLIBRI_RESULT"],
              opuscar_runtime=os.environ["OPUSCAR_RESULT"],
              openclaw=os.environ["OPENCLAW_RESULT"],
          )
          open('/tmp/m1lash-runtime-summary.json','w').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Publish summary into separate results branch (no edits to main)
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BRANCH="skill-smoke-results"
          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" >/dev/null
          fi
          content="$(base64 -w0 /tmp/m1lash-runtime-summary.json)"
          file="reports/skills/runtime_latest.json"
          existing="$(gh api "repos/$REPO/contents/$file?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh api -X PUT "repos/$REPO/contents/$file" -f message="ci: record isolated skills runtime results" -f branch="$BRANCH" -f content="$content" -f sha="$existing" >/dev/null
          else
            gh api -X PUT "repos/$REPO/contents/$file" -f message="ci: record isolated skills runtime results" -f branch="$BRANCH" -f content="$content" >/dev/null
          fi
