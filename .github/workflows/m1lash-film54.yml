name: M1lash Film 54 - actual full tobacco documentary render (no autopublish)

on:
  push:
    branches: [codex/m1lash-tobacco-film54-real-render-20261028]
    paths:
      - 'film54/**'
      - '.github/workflows/m1lash-film54.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film54-dima-documentary
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local illustration dependencies
        run: python -m pip install 'Pillow>=11,<13' 'edge-tts>=7,<8'
      - name: Python code syntax, corpus and visual storyboard
        run: |
          python -m py_compile film54/*.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'film54')
          import produce
          data,lines,words=produce.textdata()
          assert len(data)==7 and len(lines)>=55 and words>=3000
          assert produce.VOICE=="ru-RU-DmitryNeural"
          assert produce.MIN_DURATION==1260
          print('Film54 approved for actual TTS build, no silence padding:',len(lines),'paragraphs',words,'words')
          PY
          python film54/preview.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1lash-film54-original-design-review
          path: film54-output/
          retention-days: 14

  actual-film:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install TTS + illustrator + codec
        run: |
          python -m pip install 'Pillow>=11,<13' 'edge-tts>=7,<8'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate real Dima narration (no substitutes), original motion, and 1080p full video
        run: python film54/produce.py --out film54-output
      - name: Mandatory ≥21:00 technical MP4 release gate
        run: |
          python scripts/qa/longform_duration_gate.py film54-output/M1lash_Tobacco_54_25min_Dima.mp4 --report film54-output/duration_qa.json
      - name: Preserve real MP4, narration, SRT, script, and source dossier
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1lash-tobacco-54-real-mp4-and-source
          path: |
            film54-output/M1lash_Tobacco_54_25min_Dima.mp4
            film54-output/narration.wav
            film54-output/cues.json
            film54-output/script_full.txt
            film54-output/subtitles.srt
            film54-output/sources.json
            film54-output/film54_qa.json
            film54-output/duration_qa.json
          retention-days: 14
