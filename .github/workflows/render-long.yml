name: Render long video

# Параллельный рендер длинного ролика: N кусков по кадрам → склейка → mp4 с аудио → коммит в videos/long/
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Папка в longform/"
        default: "antikythera"
      chunks:
        description: "Число параллельных кусков"
        default: "20"
      fps:
        default: "30"
      audio:
        description: "Аудиофайл внутри проекта"
        default: "audio/antikythera_mix.m4a"
      only:
        description: "Перерендерить только эти куски (через запятую), остальные взять из base_run"
        default: ""
      short:
        description: "Имя вертикальной нарезки из shorts.json (пусто = основной фильм)"
        default: ""
      base_run:
        description: "ID прошлого запуска, откуда взять неизменённые куски"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
    steps:
      - id: p
        run: |
          python3 -c "import json;o='${{ inputs.only }}'.strip();print('idx='+json.dumps([int(x) for x in o.split(',')] if o else list(range(int('${{ inputs.chunks }}')))))" >> $GITHUB_OUTPUT

  chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    defaults:
      run:
        working-directory: longform/${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
          npm ci --no-audit --no-fund --silent
          npx -y playwright@1.48.2 install --with-deps chromium >/dev/null
          B=$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name chrome \) | sort | head -1)
          echo "BROWSER=$B" >> $GITHUB_ENV; echo "browser: $B"
      - name: Render chunk
        run: |
          SH="${{ inputs.short }}"
          if [ -n "$SH" ]; then DUR=$(python3 -c "import json;print(json.load(open('shorts/$SH.json'))['duration'])"); EXTRA="--short $SH"; else DUR=$(python3 -c "import json;print(json.load(open('audio/cues.json'))['duration'])"); EXTRA=""; fi
          FPS=${{ inputs.fps }}; N=${{ inputs.chunks }}; I=${{ matrix.i }}
          TOT=$(python3 -c "print(round($DUR*$FPS))")
          F0=$(python3 -c "print($TOT*$I//$N)"); F1=$(python3 -c "print($TOT*($I+1)//$N)")
          echo "frames $F0..$F1 of $TOT"
          node render.mjs $EXTRA --fps $FPS --f0 $F0 --f1 $F1 --out out/chunk_$(printf %03d $I).mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: longform/${{ inputs.project }}/out/chunk_*.mp4
          retention-days: 3

  join:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for base run
        if: inputs.base_run != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for k in $(seq 1 120); do st=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.base_run }} -q .status); echo "$st"; [ "$st" = completed ] && break; sleep 60; done
      - uses: actions/download-artifact@v4
        if: inputs.base_run != ''
        with: { path: base, pattern: chunk-*, merge-multiple: true, run-id: "${{ inputs.base_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { path: chunks, pattern: chunk-*, merge-multiple: true }
      - name: Fill unchanged chunks from base
        if: inputs.base_run != ''
        run: |
          ls chunks; cp -n base/*.mp4 chunks/; ls chunks | wc -l
      - name: Join + audio
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
          ls chunks | sort | sed "s#^#file '$PWD/chunks/#; s#\$#'#" > list.txt
          P=longform/${{ inputs.project }}
          mkdir -p videos/long
          OUT=videos/long/${{ inputs.project }}.mp4; AUD=$P/${{ inputs.audio }}
          if [ -n "${{ inputs.short }}" ]; then OUT=videos/long/${{ inputs.project }}_short_${{ inputs.short }}.mp4; AUD=$P/audio/short_${{ inputs.short }}.m4a; fi
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -i $AUD -map 0:v -map 1:a -shortest \
            -c:v libx264 -preset slow -crf 22 -maxrate 2600k -bufsize 5200k -pix_fmt yuv420p -r ${{ inputs.fps }} \
            -c:a aac -b:a 192k -movflags +faststart $OUT
          if [ -z "${{ inputs.short }}" ]; then
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 $OUT | tee $P/out_info.txt
            ffmpeg -v error -y -i $OUT -vf "fps=1/10,scale=480:-1,tile=6x6" -frames:v 1 $P/contact.jpg
          else ffprobe -v error -show_entries format=duration,size -of default=nw=1 $OUT; fi
      - name: Commit
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A videos/long longform/${{ inputs.project }}
          git commit -m "render: ${{ inputs.project }} ${{ inputs.short }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
