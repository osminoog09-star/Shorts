name: Razgon bridge · safety checks
on:
  pull_request:
    paths:
      - 'tools/razgon2d/**'
      - 'tests/test_razgon2d_bridge.py'
      - '.github/workflows/razgon-bridge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapter syntax and independent safety tests
        run: |
          python -m py_compile tools/razgon2d/bridge.py
          python -m unittest discover -s tests -p 'test_razgon2d_bridge.py' -v
