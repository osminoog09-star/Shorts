name: M1lash SCAN 2.0 - YouTube niche outliers every 12h
on:
  schedule:
    - cron: '37 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [codex/m1lash-studio-dashboard-20261028]
    paths:
      - 'motion-studio/automation/outlier_radar.py'
      - 'tests/test_m1lash_outlier_radar.py'
      - '.github/workflows/m1lash-outliers.yml'
permissions:
  contents: write
concurrency:
  group: m1lash-youtube-outlier-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests, including independent 21-minute and false-growth controls
        run: |
          python -m unittest discover -s tests -p 'test_m1lash_outlier_radar.py' -v
          python -m py_compile motion-studio/automation/outlier_radar.py
      - name: Read API only through GitHub Secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python motion-studio/automation/outlier_radar.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1lash-outliers-sample
          path: motion-studio/data/outliers.json
          retention-days: 7
      - name: Publish scanner dataset to main for GitHub Pages after successful live scan
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          data=json.load(open("motion-studio/data/outliers.json"))
          if data.get("status")!="success":
              raise SystemExit("No verified live data; keep previous dataset, no commit")
          PY
          git config user.name m1lash-scanner-bot
          git config user.email m1lash-scanner-bot@users.noreply.github.com
          git add motion-studio/data/outliers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: refresh YouTube outliers with verified API measurements"
          git pull --rebase origin main
          git push origin main
