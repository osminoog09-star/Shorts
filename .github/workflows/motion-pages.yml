name: Motion Studio · GitHub Pages
on:
  workflow_run:
    workflows: ['YouTube Analytics daily', 'YouTube Analytics', 'YouTube · daily analytics', 'YouTube · hourly pulse', 'M1lash HDRezka to private Drive', 'M1lash Drive · folder intake', 'M1lash Drive · ASR scene candidates (PRIVATE QA only)', 'YouTube direct · review then schedule', 'M1lash schedule migration 2026-11-04']
    types: [completed]
  push:
    branches: [main]
    paths: ['motion-studio/**', 'site/**', 'scripts/build_studio_site.py', 'scripts/clip_lifecycle.py', 'publishing/film_projects.json', 'publishing/queue.json', 'publishing/clip_requests.json', 'publishing/recording_plan.json', 'publishing/drive_folder.json', 'publishing/drive_scan.json', 'publishing/hdrezka_status.json', 'publishing/direct_movie_status.json', 'publishing/drive_auth_status.json', 'publishing/scene_candidates.json', 'publishing/receipts/**', 'reports/learnings.md', 'reports/weekly/**', 'reports/ideas/**', 'scripts/qa/test_clip_lifecycle.py', 'scripts/qa/test_drive_connect.cjs', 'scripts/qa/test_studio_chart.cjs', 'scripts/qa/test_studio_mobile_settings.cjs', 'tests/test_studio_review_queue.py', '.github/workflows/motion-pages.yml', '.github/workflows/m1lash-news-radar.yml', '.github/workflows/motion-trends.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: motion-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate JavaScript
        run: |
          node --check motion-studio/app.js
          node --check motion-studio/studio-v2.js
          node --check site/studio/clips_ui.js
          node scripts/qa/test_clip_lifecycle.cjs
          python3 scripts/qa/test_clip_lifecycle.py
          python3 -m unittest discover -s tests -p 'test_studio_review_queue.py' -v
          node scripts/qa/test_studio_chart.cjs
          node --check site/studio/auto_refresh.js
          node --check site/studio/scheduling.js
          for f in agents.js depth3d.js icons.js space_bg.js; do node --check site/studio/$f; done
          node --input-type=module --check < site/studio/space3d.js
          node scripts/qa/test_studio_scheduling.cjs
          node --check site/studio/drive_connect.js
          node scripts/qa/test_drive_connect.cjs
          node scripts/qa/test_studio_auto_refresh.cjs
          node scripts/qa/test_studio_settings.cjs
          node scripts/qa/test_studio_mobile_settings.cjs
          node scripts/qa/test_studio_overlay_fixed.cjs
          python3 motion-studio/automation/site_smoke.py
      - uses: actions/configure-pages@v5
      - name: Prepare only browser assets
        env:
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
        run: |
          mkdir -p _site
          cp motion-studio/index.html motion-studio/privacy.html motion-studio/studio-v2.js motion-studio/studio-v2.css motion-studio/renderer.html motion-studio/app.js motion-studio/style.css motion-studio/world.json _site/
          cp -r motion-studio/data _site/data
          git fetch -q origin +pulse-data:refs/remotes/origin/pulse-data && git show origin/pulse-data:pulse.json > reports/youtube/pulse.json || true
          python3 scripts/build_studio_site.py
          mkdir -p _site/studio && cp site/studio/index.html site/studio/clips_ui.js site/studio/auto_refresh.js site/studio/drive_connect.js site/studio/data.json site/studio/widget.html site/studio/manifest.webmanifest site/studio/icon-192.png site/studio/icon-512.png _site/studio/ && cp -r site/studio/i _site/studio/i
          cp site/studio/scheduling.js _site/studio/
          cp site/studio/glass.css site/studio/fonts.css site/studio/space3d.js site/studio/space_bg.js site/studio/icons.js site/studio/agents.js site/studio/depth3d.js _site/studio/ && cp -r site/studio/fonts site/studio/vendor _site/studio/
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          cid=os.environ.get("PUBLIC_GOOGLE_CLIENT_ID","")
          # OAuth Client IDs are public identifiers, unlike Client Secrets.
          if re.fullmatch(r"[0-9]+-[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com",cid):
              Path("_site/studio/google_client.json").write_text(json.dumps({"client_id":cid})+"\n")
          else:
              Path("_site/studio/google_client.json").write_text('{"status":"unavailable"}\n')
          print("Studio public OAuth Client ID:", "ready" if re.fullmatch(r"[0-9]+-[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com",cid) else "unavailable")
          PY
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

