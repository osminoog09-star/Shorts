name: Motion Studio · GitHub Pages
on:
  workflow_run:
    workflows: ['YouTube Analytics daily', 'YouTube Analytics', 'YouTube · daily analytics', 'YouTube · hourly pulse']
    types: [completed]
  push:
    branches: [main]
    paths: ['motion-studio/**', 'site/**', 'scripts/build_studio_site.py', 'publishing/queue.json', 'publishing/receipts/**', 'reports/learnings.md', 'reports/weekly/**', 'reports/ideas/**', '.github/workflows/motion-pages.yml', '.github/workflows/m1lash-news-radar.yml', '.github/workflows/motion-trends.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: motion-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate JavaScript
        run: |
          node --check motion-studio/app.js
          node --check motion-studio/studio-v2.js
          python3 motion-studio/automation/site_smoke.py
      - uses: actions/configure-pages@v5
      - name: Prepare only browser assets
        run: |
          mkdir -p _site
          cp motion-studio/index.html motion-studio/privacy.html motion-studio/studio-v2.js motion-studio/studio-v2.css motion-studio/renderer.html motion-studio/app.js motion-studio/style.css motion-studio/world.json _site/
          cp -r motion-studio/data _site/data
          git fetch -q origin pulse-data && git show origin/pulse-data:pulse.json > reports/youtube/pulse.json || true
          python3 scripts/build_studio_site.py
          mkdir -p _site/studio && cp site/studio/index.html site/studio/data.json site/studio/widget.html site/studio/manifest.webmanifest site/studio/icon-192.png site/studio/icon-512.png _site/studio/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
