name: M1lash schedule migration 2026-11-04
on:
  push:
    branches: [main]
    paths: ['publishing/migrations/20261104_execute.json']
permissions:
  contents: write
concurrency:
  group: m1lash-schedule-migration-20261104
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32,<3'
      - name: Verify owner migration ticket and adjust existing YouTube video schedules
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: python scripts/youtube_schedule_migration.py
