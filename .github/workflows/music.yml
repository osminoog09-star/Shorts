name: Music

# Разрешённая музыка: пушнул jobs/music/<name>.json -> media/music/*.mp3 + *.license.txt
on:
  push:
    paths: ["jobs/music/**.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_music.py jobs/music/*.json
      - name: Commit
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add media/music
          git diff --cached --quiet && exit 0
          git commit -m "music: fetch licensed tracks"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
