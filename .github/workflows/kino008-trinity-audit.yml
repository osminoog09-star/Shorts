name: KINO008 · Trinity dense PRIVATE scene and RU word timings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kino008-trinity-audit.yml']
permissions:
  contents: write
concurrency:
  group: kino008-trinity-qa-once
  cancel-in-progress: false
jobs:
  private_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install FFmpeg and private ASR QA
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q 'faster-whisper>=1.0,<2' 'Pillow>=10,<12'
          python -m py_compile scripts/qa/kino008_scene_audit.py
      - name: Dense original sequence and original Russian actor speech check
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/qa/kino008_scene_audit.py
      - name: Commit metadata-only report, no film, image or private dialogue
        if: always()
        run: |
          set -euo pipefail
          f=reports/research/2026-11-06_KINO_008_TRINITY_PRIVATE_TIMELINE.json
          if test -s "$f"; then
            cp "$f" "$RUNNER_TEMP/kino008_trinity.json"
            git config user.name 'kino008-qa[bot]'
            git config user.email 'kino008-qa@users.noreply.github.com'
            for n in 1 2 3; do
              git fetch -q origin main
              git reset -q --hard origin/main
              cp "$RUNNER_TEMP/kino008_trinity.json" "$f"
              git add "$f"
              git diff --cached --quiet && exit 0
              git commit -qm 'qa(kino008): save private Trinity contact/ASR IDs only'
              if git push -q origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
