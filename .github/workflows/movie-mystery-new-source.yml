name: Movie mystery new film - source and draft inspection
on:
  push:
    branches: [main]
    paths: [.github/workflows/movie-mystery-new-source.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qqy install ffmpeg
          python -m pip install -q yt-dlp
      - name: Source scene candidates (Russian original dubbing)
        shell: bash
        run: |
          set -u
          mkdir -p output
          urls=(
            'https://rutube.ru/video/953075218f34bb8a903bf6a72aea7036/'
            'https://www.youtube.com/watch?v=UnbEmj6qXIY'
            'https://rutube.ru/video/953a8b19ad3d833dcbe1146716e33425/'
          )
          for url in "${urls[@]}"; do
            echo "Candidate URL: $url"
            if timeout 100 python -m yt_dlp --no-playlist --no-warnings                 -f 'bv*[height<=1080]+ba/b[height<=1080]/best'                 --merge-output-format mp4 --retries 1 --fragment-retries 1                 -o 'output/movie_source.%(ext)s' "$url"; then
              break
            fi
            rm -f output/movie_source.*
          done
          shopt -s nullglob
          media=(output/movie_source.mp4 output/movie_source.mkv output/movie_source.webm)
          test "${#media[@]}" -ge 1 || { echo 'No actual source found'; exit 1; }
          src="${media[0]}"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$src" | tee output/source_probe.json
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "fps=1/3,scale=280:-2,tile=5x4" -frames:v 1 output/contact.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-movie-mystery-new-scene
          path: output/
          retention-days: 7
