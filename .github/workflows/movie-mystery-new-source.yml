name: Movie mystery new film - original Russian source follow-up
on:
  push:
    branches: [main]
    paths: [.github/workflows/movie-mystery-new-source.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qqy install ffmpeg
          python -m pip install -q yt-dlp
      - name: Acquire larger original-film Russian-dubbed scenes
        shell: bash
        run: |
          set -u
          mkdir -p output
          urls=(
            'https://rutube.ru/video/e796697836f651666f33f197013470e2/'
            'https://rutube.ru/video/bd5d8867140cb314f9c54e17766f910f/'
            'https://rutube.ru/video/953a8b19ad3d833dcbe1146716e33425/'
          )
          for url in "${urls[@]}"; do
            echo "Candidate URL: $url"
            if timeout 130 python -m yt_dlp --no-playlist --no-warnings                 -f 'bv*[height<=720]+ba/b[height<=720]/best'                 --merge-output-format mp4 --retries 1 --fragment-retries 1                 -o 'output/source_raw.%(ext)s' "$url"; then
              break
            fi
            rm -f output/source_raw.*
          done
          shopt -s nullglob
          media=(output/source_raw.mp4 output/source_raw.mkv output/source_raw.webm)
          test "${#media[@]}" -ge 1 || exit 1
          src="${media[0]}"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$src" | tee output/source_probe.json
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "fps=1/20,scale=480:-2,tile=4x5" -frames:v 1 output/contact.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-movie-mystery-feature-source
          path: output/
          retention-days: 7
