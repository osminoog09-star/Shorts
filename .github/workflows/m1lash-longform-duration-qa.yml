name: M1lash longform 21-minute rule tests
on:
  push:
    paths: ['scripts/qa/longform_duration_gate.py','tests/test_m1lash_longform_duration.py','.github/workflows/render-long.yml','.github/workflows/join-long.yml']
  pull_request:
    paths: ['scripts/qa/longform_duration_gate.py','tests/test_m1lash_longform_duration.py','.github/workflows/render-long.yml','.github/workflows/join-long.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test 21-minute threshold and audio/video checks
        run: python -m unittest discover -s tests -p test_m1lash_longform_duration.py -v
