name: "M1lash · AI Office long animated sketch"
on:
  push:
    branches: ["codex/office-ai-long-sketch-20261027"]
    paths: [".github/workflows/ai-office-long-sketch.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free voice and movie dependencies
        run: |
          python -m pip install --quiet "edge-tts>=7,<8" "mutagen>=1.47" "Pillow>=11,<13" "numpy>=2,<3" imageio-ffmpeg
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ffmpeg" -version | head -n 1
      - name: Speech — Microsoft Dmitry only, no fallback voices
        run: |
          python -u longform/ai_office/make_voice.py
      - name: Upload verified Dmitry stems
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-ai-office-dmitry-stems
          path: longform/ai_office/voice/
          retention-days: 14
      - name: Render original cartoon movie with music
        run: |
          python -u longform/ai_office/render.py
      - name: Publish private artifact to download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-ai-office-long-video
          path: |
            longform/ai_office/M1lash_AI_OFFICE_LONG_RU.mp4
            longform/ai_office/M1lash_AI_OFFICE_THUMB.jpg
            longform/ai_office/output/qa.json
            longform/ai_office/episode.json
          if-no-files-found: warn
          retention-days: 14
