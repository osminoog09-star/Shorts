name: M1lash HDRezka to private Drive
on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS film URL at rezka.ag or hdrezka.ag
        required: false
        type: string
      quality:
        description: Desired video resolution
        type: choice
        options: ['1080p', '720p']
        default: '1080p'
      mode:
        description: Inspect or download
        type: choice
        options: ['inspect', 'download', 'drive_check']
        default: 'inspect'
      translation:
        description: Exact dubbing name (optional)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/hdrezka_intake.py'
      - 'scripts/qa/test_hdrezka_intake.py'
      - 'scripts/drive_oauth_config.py'
      - 'scripts/qa/test_drive_oauth_config.py'
      - 'scripts/drive_oauth_exchange.py'
      - 'scripts/qa/test_drive_oauth_exchange.py'
      - '.github/workflows/drive-oauth-exchange.yml'
      - '.github/workflows/hdrezka-intake.yml'

permissions:
  contents: write

concurrency:
  # CI pushes must not queue behind an owner-requested film/Drive job.
  group: m1lash-media-intake-${{ github.event_name == 'push' && 'checks' || 'owner' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Offline tests
        run: |
          python3 -m unittest discover -s scripts/qa -p 'test_hdrezka_intake.py' -v
          python3 -m unittest discover -s scripts/qa -p 'test_drive_oauth_config.py' -v
          python3 -m unittest discover -s scripts/qa -p 'test_drive_oauth_exchange.py' -v
      - name: Detect reusable Drive OAuth (never log token)
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/qa/drive_credentials_probe.py
      - name: Diagnose existing Drive OAuth safely (nonfatal)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.drive_oauth_config import resolve_existing_client, DriveSetupError
          if not os.environ.get("GDRIVE_REFRESH_TOKEN"):
              print("Drive OAuth preflight: missing_refresh_token")
          else:
              try:
                  _, matched = resolve_existing_client(os.environ)
                  print("Drive OAuth preflight: google_api_folder_write_ok; client =", matched)
              except DriveSetupError as exc:
                  print("Drive OAuth preflight:", exc.code)
          PY
      - name: Safe rclone diagnostic on push (no credentials in logs)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from scripts.drive_oauth_config import resolve_existing_client, save_config, DriveSetupError
          try:
              selected, client = resolve_existing_client(dict(os.environ))
              with tempfile.TemporaryDirectory() as tmp:
                  config = Path(tmp) / "rclone.conf"
                  save_config(selected, config)
                  p = subprocess.run(["rclone", "--config", str(config), "lsf", "m1lash:",
                                      "--max-depth", "1", "--retries", "1"],
                                     capture_output=True, text=True, timeout=90)
              if p.returncode == 0:
                  print("Rclone diagnostic: success; OAuth and list operations ready")
              else:
                  # Never print raw stdout/stderr: they may contain private paths,
                  # tokens, account names or remote resource identifiers.
                  stderr = (p.stderr or "").lower()
                  markers = ["invalid_client", "invalid_grant", "unauthorized_client",
                             "oauth2", "token", "root_folder_id", "403", "404", "401",
                             "insufficient", "directory not found", "config",
                             "failed to create file system", "failed to list",
                             "access denied", "malformed", "couldn't find", "refresh",
                             "empty", "forbidden", "googleapi", "invalid character"]
                  print("Rclone diagnostic: failure; markers = " +
                        json.dumps([m for m in markers if m in stderr]))
          except DriveSetupError as exc:
              print("Rclone diagnostic: oauth preflight error:", exc.code)
          except Exception:
              print("Rclone diagnostic: unexpected failure (no details logged)")
          PY
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.0' }
      - name: Compile pinned HDRezka CLI (no movie download)
        run: |
          go install github.com/n0madic/go-hdrezka/cmd/hdrezka-dl@v0.0.0-20260804201230-e54f62241917
          "$(go env GOPATH)/bin/hdrezka-dl" --help > /dev/null

  intake:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Clear only current job status in runner
        env:
          MOVIE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$MOVIE_MODE" != 'drive_check' ]; then rm -f publishing/hdrezka_status.json; fi
          if [ "$MOVIE_MODE" != 'inspect' ]; then rm -f publishing/drive_auth_status.json; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.0' }
      - name: Install pinned source CLI
        if: inputs.mode != 'drive_check'
        run: |
          go install github.com/n0madic/go-hdrezka/cmd/hdrezka-dl@v0.0.0-20260804201230-e54f62241917
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Drive upload tool
        if: inputs.mode == 'download' || inputs.mode == 'drive_check'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Create and verify private Google Drive OAuth
        if: inputs.mode == 'download' || inputs.mode == 'drive_check'
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 scripts/drive_oauth_config.py --config "$RUNNER_TEMP/m1lash-rclone.conf" --check
      - name: Inspect or download privately
        if: inputs.mode != 'drive_check'
        env:
          MOVIE_URL: ${{ inputs.url }}
          MOVIE_QUALITY: ${{ inputs.quality }}
          MOVIE_MODE: ${{ inputs.mode }}
          MOVIE_TRANSLATION: ${{ inputs.translation }}
          GDRIVE_FOLDER_ID: 1ANvcXlUj0wBv1CG5U0bBQGdH-32OyaAi
          GDRIVE_RCLONE_CONFIG_PATH: ${{ runner.temp }}/m1lash-rclone.conf
        run: python3 scripts/hdrezka_intake.py
      - name: Delete temporary media and credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/m1lash_media"
          rm -f "$RUNNER_TEMP/m1lash-rclone.conf"
      - name: Record safe metadata status
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" != "drive_check" ] && [ ! -s publishing/hdrezka_status.json ]; then
            printf '{"status":"error","error_code":"setup_failed","message":"Загрузчик не стартовал; проверь GitHub Actions.","drive_uploaded":false}\n' > publishing/hdrezka_status.json
          fi
          if [ "${{ inputs.mode }}" != "inspect" ] && [ ! -s publishing/drive_auth_status.json ]; then
            printf '{"status":"error","connected":false,"error_code":"setup_failed","message":"Проверка OAuth не запустилась; см. GitHub Actions."}\n' > publishing/drive_auth_status.json
          fi
          git config user.name 'm1lash-intake[bot]'
          git config user.email 'm1lash-intake@users.noreply.github.com'
          git add publishing/hdrezka_status.json publishing/drive_auth_status.json
          git diff --cached --quiet && exit 0
          git commit -m "media: update private intake status (no movie bytes)"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
