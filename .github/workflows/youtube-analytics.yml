name: YouTube · daily analytics
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/youtube_analytics.py
      - scripts/ideas_auto.py
      - .github/workflows/youtube-analytics.yml
permissions:
  contents: write
concurrency:
  group: youtube-analytics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Test collector without credentials
        run: python -m unittest discover -s tests -p 'test_youtube_analytics.py' -v
      - name: Collect RU analytics (read-only YouTube access)
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_analytics.py
      - name: Auto ideas of the day (skips if GPT already wrote today's)
        run: python scripts/ideas_auto.py
      - name: Save reports without overwriting concurrent work
        run: |
          git config user.name 'M1lash analytics bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/youtube reports/videos.csv reports/ideas
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analytics: daily YouTube metrics [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-analytics-${{ github.run_id }}
          path: |
            reports/youtube/
            reports/videos.csv
          retention-days: 30
