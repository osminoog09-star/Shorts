name: M1lash film source RU-language verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/movie-ru-source-language-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: chigur_gas, run_id: 41198730044}
          - {label: nightcrawler_trailer, run_id: 41198732395}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: movie-edit-draft
          run-id: ${{ matrix.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q 'faster-whisper>=1.1,<2'
      - name: Detect actual speech language from downloaded audio, not website title
        env:
          LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import json,subprocess,os,pathlib
          from faster_whisper import WhisperModel
          paths=list(pathlib.Path('source').rglob('*.mp4'))
          assert len(paths)==1,paths
          source=paths[0]
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(source)]))
          m=WhisperModel('tiny',device='cpu',compute_type='int8')
          report=[]
          for i,pos in enumerate([5,max(5,round(dur*.35)),max(5,round(dur*.72))]):
              out=f'source/audio_{i}.wav'
              subprocess.run(['ffmpeg','-v','error','-y','-ss',str(pos),'-t','19','-i',str(source),'-vn','-ac','1','-ar','16000',out],check=True)
              segments,info=m.transcribe(out,beam_size=2,vad_filter=True)
              report.append({'start_s':pos,'detected_language':info.language,'probability':round(float(info.language_probability),3),'samples':[x.text.strip() for x in list(segments)[:4]]})
          pathlib.Path('reports').mkdir(exist_ok=True)
          result={'label':os.environ['LABEL'],'source':source.name,'duration_s':dur,'samples':report,'verified_ru':sum(a['detected_language']=='ru' and a['probability']>.75 for a in report)>=2,'note':'Auto ASR not a substitute for full human audio QA or source rights'}
          pathlib.Path('reports/ru_check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-film-language-${{ matrix.label }}
          path: reports/ru_check.json
          retention-days: 7
