name: M1lash free tool staging - isolated download and audit
on:
  push:
    branches: [codex/studio-hardening-free-tools-20261028]
    paths: ['tools/free_video/**','tools/security/wheel_guard.py','.github/workflows/m1lash-free-tools-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download pinned wheels only (do not install or run)
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse -r tools/free_video/requirements-scene.txt
      - name: Static ZIP / integrity inspection BEFORE install
        run: python tools/security/wheel_guard.py wheelhouse > wheel-inspection.json
      - name: Scan pinned package dependency advisories (read-only query)
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip_audit --requirement tools/free_video/requirements-scene.txt --progress-spinner off
      - name: Install isolated tool after safeguards
        run: |
          python -m venv .scene-venv
          .scene-venv/bin/python -m pip install --no-index --find-links wheelhouse -r tools/free_video/requirements-scene.txt
          .scene-venv/bin/python -m scenedetect version
      - name: Smoke-test scene detection on an existing M1lash MP4
        run: |
          .scene-venv/bin/python tools/free_video/scene_report.py videos/m1lash_ai_news_2026_10_28_ru.mp4 --output work/scene_audit
          find work/scene_audit -type f -name '*.csv' -print -quit | grep -q .
      - name: Archive inspected wheel checksums (no executable upload)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scenedetect-0.7.2-audited-wheelhouse
          path: |
            wheel-inspection.json
            wheelhouse/*.whl
            work/scene_audit/*.csv
          retention-days: 14
