name: Last Access 2.5D illustrated opening preview

on:
  push:
    branches:
      - codex/last-access-2d5-production-20261027
    paths:
      - 'longform/last-access/**'
      - '.github/workflows/last-access-2d5-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-opening:
    name: Render 70-second graphic-novel style test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Install FFmpeg and Cyrillic font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Check video render prerequisites
        run: |
          ffmpeg -version | head -1
          ffmpeg -filters | grep -E 'zoompan|subtitles|drawtext'
      - name: Render opening 2.5D visual test from separate references
        run: bash longform/last-access/render_2_5D_opening_preview.sh
      - name: Inspect exported media and still frames
        run: |
          test -s longform/last-access/_preview_render/output/Last_Access_EP01_2_5D_OPENING_PREVIEW.mp4
          ffprobe -v error -show_entries format=duration,size -of json longform/last-access/_preview_render/output/Last_Access_EP01_2_5D_OPENING_PREVIEW.mp4
      - name: Save downloadable MP4, subtitles and image QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-access-2d5-opening-preview
          path: |
            longform/last-access/_preview_render/output/
            longform/last-access/preview_2_5D_opening.srt
          if-no-files-found: warn
          retention-days: 30
