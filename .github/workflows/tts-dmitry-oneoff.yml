name: M1lash Dmitry voice one-off
on:
  push:
    branches:
      - codex/dmitry-m1lash-20261026
    paths:
      - .github/workflows/tts-dmitry-oneoff.yml
  workflow_dispatch:
jobs:
  dmitry-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free neural speech synthesizer
        run: python -m pip install --disable-pip-version-check edge-tts==7.3.1
      - name: Generate Russian voice with partial preservation
        shell: bash
        run: |
          mkdir -p audio
          python - <<'PY'
          import asyncio
          import edge_tts
          from pathlib import Path
          clips = {
              "intro": ["Вот как я выхожу гулять, когда один..."],
              "reaction": ["Стоп! Это было слишком эпично!", "Стоп, это было эпично!"],
              "outro": ["А ты тоже так гуляешь? Ставь лайк, подписывайся и пиши в комментариях!", "А ты тоже так гуляешь? Ставь лайк, подписывайся и пиши коммент!"],
          }
          async def main():
              for name, variants in clips.items():
                  out = Path("audio") / f"{name}.mp3"
                  success=False
                  for attempt in range(1, 9):
                      try:
                          if out.exists(): out.unlink()
                          line=variants[(attempt-1)%len(variants)]
                          task = edge_tts.Communicate(text=line, voice="ru-RU-DmitryNeural", rate="+8%")
                          await task.save(str(out))
                          if out.stat().st_size < 5000: raise ValueError("Audio too short")
                          print("SUCCESS",name,out.stat().st_size,flush=True)
                          success=True
                          break
                      except Exception as exc:
                          print("retry", attempt,name,type(exc).__name__,str(exc)[:80],flush=True)
                          await asyncio.sleep(1.0)
                  if not success:
                      if out.exists(): out.unlink()
                      print("UNAVAILABLE",name,flush=True)
              print("GENERATED:",*[p.name for p in Path("audio").glob("*.mp3")],flush=True)
          asyncio.run(main())
          PY
      - name: Upload every completed audio clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-dmitry-voice-20261026
          path: audio/*.mp3
          if-no-files-found: warn
          retention-days: 14
