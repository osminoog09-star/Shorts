name: M1lash Dmitry voice one-off
on:
  push:
    branches:
      - codex/dmitry-m1lash-20261026
    paths:
      - .github/workflows/tts-dmitry-oneoff.yml
  workflow_dispatch:
jobs:
  dmitry-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free neural speech synthesizer
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate three Russian voice segments
        shell: bash
        run: |
          mkdir -p audio
          python - <<'PY'
          import asyncio
          import edge_tts
          from pathlib import Path
          clips = {
              "intro": "Вот как я выхожу гулять, когда один...",
              "reaction": "Стоп! Это было слишком эпично!",
              "outro": "А ты тоже так гуляешь? Ставь лайк, подписывайся и пиши в комментариях!",
          }
          async def main():
              for name, line in clips.items():
                  out=Path("audio")/f"{name}.mp3"
                  c=edge_tts.Communicate(text=line,voice="ru-RU-DmitryNeural",rate="+8%")
                  await c.save(str(out))
                  assert out.stat().st_size>5000,(name,out.stat().st_size)
                  print(name,out.stat().st_size)
          asyncio.run(main())
          PY
      - name: Upload reusable voice clips
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-dmitry-voice-20261026
          path: audio/*.mp3
          if-no-files-found: error
          retention-days: 14
