name: M1lash drawn lab visual preflight and native pilot
on:
  push:
    branches: [codex/drawn-explainers-20261028]
    paths: [.github/workflows/drawn-preflight.yml, longform/drawn-lab-20261028/build_drawn.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            longform/drawn-lab-20261028
            studio/src/Narrator2.tsx
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare exact tools and original engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2
          pip install edge-tts==7.3.1 cairosvg
          git clone --depth 1 https://github.com/alchaincyf/huashu-motion.git /tmp/huashu-motion
          git -C /tmp/huashu-motion fetch --depth 1 origin 52467f99c602b76ba86d511d37acdfe93fa1e16e
          git -C /tmp/huashu-motion checkout --detach 52467f99c602b76ba86d511d37acdfe93fa1e16e
          curl --fail -L -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q /tmp/rhubarb.zip -d /tmp/rhubarb
          cd longform/drawn-lab-20261028
          npm ci --ignore-scripts
          npm rebuild esbuild
      - uses: actions/download-artifact@v4
        with:
          name: m1lash-drawn-all-accepted-voices
          run-id: 40764224486
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: longform/drawn-lab-20261028/build
      - uses: actions/download-artifact@v4
        with:
          name: m1lash-drawn-measured-timelines
          run-id: 40764224486
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: longform/drawn-lab-20261028/build
      - name: Original host artwork and actual lip cues
        env:
          RHUBARB: /tmp/rhubarb/Rhubarb-Lip-Sync-1.13.0-Linux/rhubarb
        run: |
          cd longform/drawn-lab-20261028
          ./node_modules/.bin/esbuild host.tsx --bundle --platform=node --external:react --external:react-dom/server --outfile=build/host.cjs
          node build/host.cjs
          python native_prepare.py --ids=0,2,27,31,90,91,92
          python edit_timeline.py
      - name: Build two native compositions
        env:
          HUASHU_ROOT: /tmp/huashu-motion
        run: |
          cd longform/drawn-lab-20261028
          python movie.py
          python build_drawn.py --ids=0,2,27,31,90,91,92
      - name: Stills, real soundtrack, MP4 and QA
        run: |
          for P in longform/drawn-lab-20261028/build/native/scene_*; do
            node /tmp/huashu-motion/cli/om.js check "$P" --source
            node /tmp/huashu-motion/cli/om.js still "$P" --at 0.4,5,12,30,40,48
            node /tmp/huashu-motion/cli/om.js sound "$P"
          done
          node /tmp/huashu-motion/cli/om.js render longform/drawn-lab-20261028/build/native/scene_92 --fps 30 --workers 4
          node /tmp/huashu-motion/cli/om.js qa longform/drawn-lab-20261028/build/native/scene_92
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1lash-drawn-preflight
          path: longform/drawn-lab-20261028/build/native
          retention-days: 14
          if-no-files-found: error
