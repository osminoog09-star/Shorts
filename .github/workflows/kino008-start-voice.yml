name: KINO008 · launch owner-private Denis title voice once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kino008-start-voice.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch_once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact job and single dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='jobs/voice/kino_008_title_v2.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j['job_id']=='kino_008_title_v2' and j['voice_id']=='denis-qwen3tts-reference-v1'
          assert len(j['utterances'])==2
          assert [x['id'] for x in j['utterances']]==['prefix','name']
          PY
          gh workflow run denis-voice-tts.yml --ref main -f job_path=jobs/voice/kino_008_title_v2.json
          echo 'KINO008_VOICE_PRIVATE_TTS_DISPATCHED_NO_PUBLIC_UPLOAD'
