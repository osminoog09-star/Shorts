name: Samsung V8 rescue exact neural segments
on:
  push:
    branches: [codex/samsung-long-map-20261027]
    paths: ['.github/workflows/samsung-v8-rescue-neural.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  rescue:
    strategy:
      fail-fast: false
      matrix:
        id: [E00_01,E10_01,E12_02,E14_01]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/samsung-long-map-20261027}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q "edge-tts>=7,<8"
      - name: Synthesize short halves with original requested neural voice
        env: {ID: '${{ matrix.id }}'}
        run: |
          python - <<'PY'
          import json,os,re,pathlib,subprocess,shutil
          name=os.environ['ID']
          doc=json.loads(pathlib.Path('jobs/tts/samsung_v8_new_research.json').read_text())
          raw=[]
          for par in doc['paragraphs']:
              buf=[];batches=[]
              for sent in re.split(r'(?<=[.!?])\s+',par['text']):
                  if buf and len((' '.join(buf)+' '+sent).split())>42:
                      batches.append(' '.join(buf));buf=[]
                  buf.append(sent)
              if buf:batches.append(' '.join(buf))
              for k,s in enumerate(batches):
                  if par['id']+'_'+str(k).zfill(2)==name:raw=[par,s]
          assert raw,'bad segment '+name
          par,text=raw
          tokens=text.split();mid=len(tokens)//2
          chunks=[' '.join(tokens[:mid]),' '.join(tokens[mid:])]
          assert ' '.join(chunks)==text
          out=pathlib.Path('media/tts/v8_rescue_parts');out.mkdir(parents=True,exist_ok=True)
          for part,words in enumerate(chunks):
              sid=name+'_part'+str(part)
              jpath=pathlib.Path('jobs/tts')/('v8rescue_'+sid+'.json')
              jpath.write_text(json.dumps({'voice':par['voice'],'rate':'+1%',
                    'pitch':'+0Hz','lines':[{'id':sid,'text':words}]},ensure_ascii=False))
              src=pathlib.Path('media/tts')/jpath.stem/(sid+'.mp3')
              for attempt in range(4):
                  p=subprocess.run(['timeout','120','python','scripts/tts_job.py',str(jpath)],
                                   capture_output=True,text=True)
                  if src.exists() and src.stat().st_size>1400:break
                  print('TRY',sid,attempt,(p.stdout+p.stderr)[-350:],flush=True)
              assert src.exists() and src.stat().st_size>1400,'no true neural voice for '+sid
              shutil.copyfile(src,out/(sid+'.mp3'))
              shutil.copyfile(src.with_suffix('.json'),out/(sid+'.json'))
              print('READY',sid,src.stat().st_size,par['voice'],flush=True)
          (out/(name+'_manifest.json')).write_text(json.dumps(
              {'segment':name,'text':text,'parts':[name+'_part0',name+'_part1'],
               'voice_id':par['voice'],'speaker':par['speaker']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samsung-v8-rescue-parts-${{ matrix.id }}
          path: media/tts/v8_rescue_parts/
          if-no-files-found: warn
          retention-days: 30
