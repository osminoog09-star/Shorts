name: Скаут материала (PD/CC фильмы)
# Решение Дениса 06.11.2026: студия сама ищет материал для кино-Shorts. Только законные бесплатные фильмы
# (общественное достояние / Creative Commons по метаданным источника). Ничего не заливает на YouTube.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # раз в неделю, пн
permissions:
  contents: write
concurrency: { group: material-scout, cancel-in-progress: false }
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/scout/pd_scout.py --rows 150
      - name: Commit library
        run: |
          git config user.name material-scout-bot
          git config user.email material-scout-bot@users.noreply.github.com
          git add reports/scout/library.json
          git diff --cached --quiet && exit 0
          git commit -m "scout: обновлена библиотека законных фильмов"
          git pull --rebase origin main && git push origin HEAD:main
