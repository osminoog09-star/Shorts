name: M1lash Studio · news radar every 12 hours

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/m1lash-studio-dashboard-20261028]
    paths:
      - 'motion-studio/automation/news_radar.py'
      - 'motion-studio/data/news.json'
      - 'tests/test_m1lash_news_radar.py'
      - '.github/workflows/m1lash-news-radar.yml'

permissions:
  contents: write

concurrency:
  group: m1lash-news-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline source and safety tests
        run: python -m unittest discover -s tests -p 'test_m1lash_news_radar.py' -v
      - name: Collect real RSS headlines from source feeds
        run: python motion-studio/automation/news_radar.py
      - name: Preserve JSON preview for manual inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: news-radar-source-links
          path: motion-studio/data/news.json
          retention-days: 7
      - name: Update live GitHub Pages data only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "m1lash-news-bot"
          git config user.email "m1lash-news-bot@users.noreply.github.com"
          git add motion-studio/data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "news: verified RSS headlines and timestamps (not fact-checked)"
          git pull --rebase origin main
          git push origin main
