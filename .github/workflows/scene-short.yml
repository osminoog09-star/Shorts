name: Scene Short · 3D-сцена кодом → голос Дениса → концовка v7 → QA (PRIVATE)
# Generic version of mini-strike.yml for any longform/<id>/ scene (index.html + scene.js + mix.py).
# Denis voice comes from the 1-day artifact of denis-voice-tts and never enters Git. Silent QA images go to branch qa/<id>.
# Review copy → owner-private Google Drive. YouTube: only upload=true, PRIVATE, no date (AGENTS §6), after owner «ок».
on:
  workflow_dispatch:
    inputs:
      id: { description: 'project id = folder longform/<id> and output name <id>_ru.mp4', required: true }
      voice_run: { description: 'run id of denis-voice-tts for this project', required: true }
      music: { description: 'file in media/music/', required: true, default: 'Investigations.mp3' }
      upload: { description: 'after QA: upload PRIVATE to YouTube without date (needs publishing/queue/<id>_ru.json)', type: boolean, default: false }
permissions:
  contents: write
  actions: read
concurrency: { group: 'scene-short-${{ inputs.id }}', cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      ID: ${{ inputs.id }}
      KIT: longform/smart-strike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        timeout-minutes: 15
        run: |
          set -euo pipefail
          case "$ID" in *[!a-z0-9_]*|'') echo '::error::bad id'; exit 1;; esac
          test -f "longform/$ID/index.html" && test -f "longform/$ID/mix.py"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q numpy scipy requests
          cd "$KIT" && npm install --no-audit --no-fund
      - name: Headless Chromium for Playwright 1.56.1
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd "$KIT"
          export DEBIAN_FRONTEND=noninteractive
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          sudo -E env "PATH=$PATH" ./node_modules/.bin/playwright install-deps chromium
          ./node_modules/.bin/playwright install chromium-headless-shell chromium
      - name: Private Denis voice from artifact (not committed)
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/voices"; mkdir -p "$V/d"
          gh run download "${{ inputs.voice_run }}" -R "$GITHUB_REPOSITORY" -D "$V/d"
          find "$V/d" -name '*.wav' -exec cp {} "$V/" \;
          find "$V/d" -name 'manifest.json' -exec cp {} "$RUNNER_TEMP/voice_manifest.json" \;
          ls -la "$V"/*.wav
      - name: Mix (voice + own SFX + CC-BY music), writes voices/dur.json for subtitles
        run: python "longform/$ID/mix.py" "$RUNNER_TEMP/voices" "media/music/${{ inputs.music }}" "$RUNNER_TEMP/mix"
      - name: Render 1080x1920 30fps (Three.js, deterministic frames)
        run: |
          set -euo pipefail
          cd "$KIT"
          node core/render/video.mjs "../$ID" --fps 30 --workers 4 --size 1080x1920 --out "$RUNNER_TEMP/render/video.mp4"
      - name: Body = picture (limited-range BT.709) + mix
        run: |
          set -euo pipefail
          ffmpeg -v error -y -i "$RUNNER_TEMP/render/video.mp4" -i "$RUNNER_TEMP/mix/mix.wav" -map 0:v -map 1:a \
            -vf "scale=in_range=pc:out_range=tv,format=yuv420p" -c:v libx264 -preset slow -crf 16 \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:a aac -b:a 256k -ar 48000 -shortest "$RUNNER_TEMP/body.mp4"
          ffprobe -v error -show_entries stream=pix_fmt,color_range,color_space -of compact "$RUNNER_TEMP/body.mp4"
      - name: Approved Denis v7 outro (private Drive, SHA-checked)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/fetch_outro.py
          python scripts/fetch_outro.py --verify-only
      - name: Assemble with outro (assemble_with_outro.py, vertical)
        run: |
          set -euo pipefail
          mkdir -p "longform/$ID/out"
          python tools/assemble_with_outro.py "$RUNNER_TEMP/body.mp4" -o "longform/$ID/out/${ID}_ru.mp4" --max-seconds 59
          sha256sum "longform/$ID/out/${ID}_ru.mp4" | tee "$RUNNER_TEMP/sha.txt"
      - name: QA — check.py, look.py, full decode, frame sheets
        run: |
          set -euo pipefail
          F="longform/$ID/out/${ID}_ru.mp4"; Q="$RUNNER_TEMP/qa"; mkdir -p "$Q"
          ffmpeg -v error -xerror -i "$F" -f null - && echo "DECODE PASS" | tee "$Q/decode.txt"
          python skills/ext/ffmpeg-skill/scripts/check.py "$F" --platform youtube-shorts --json > "$Q/check.json" || true
          cat "$Q/check.json"
          python skills/ext/ffmpeg-skill/scripts/look.py "$F" --tiles 4x3 --width 1600 --safe youtube-shorts -o "$Q/look_sheet.png"
          ffmpeg -v error -y -i "$F" -vf "fps=2,scale=216:384,tile=15x7" -frames:v 1 "$Q/sheet_2fps.jpg"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt,color_range,sample_rate,channels -show_entries format=duration -of compact "$F" > "$Q/probe.txt"
          cp "$RUNNER_TEMP/mix/mix_report.json" "$Q/"; cp "longform/$ID/out/${ID}_ru.mp4.qa.json" "$Q/assemble_qa.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/voice_manifest.json" "$Q/voice_manifest.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/sha.txt" "$Q/"
          ffmpeg -hide_banner -i "$F" -af ebur128=peak=true -f null - 2>&1 | tail -12 > "$Q/loudness.txt"
          cat "$Q/loudness.txt" "$Q/probe.txt"
      - name: Owner review copy → private Google Drive (not Git, not YouTube)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/drive_private_upload.py --folder "${ID}_review_${{ github.run_number }}" \
            "longform/$ID/out/${ID}_ru.mp4" "$RUNNER_TEMP/qa/check.json"
          python -c "import json;print(json.load(open('drive_review_receipt.json'))['folder_url'])" | tee "$RUNNER_TEMP/qa/drive_folder.txt"
      - name: Push silent QA images to branch qa/<id>
        if: always()
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/qa"; test -d "$Q" || exit 0
          cd "$RUNNER_TEMP"; rm -rf qab && mkdir qab && cd qab
          git init -q && git checkout -q -b "qa/$ID"
          cp "$Q"/* . && git add .
          git -c user.name=qa-bot -c user.email=qa-bot@users.noreply.github.com commit -qm "QA $ID run ${{ github.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "qa/$ID"
      - name: Private YouTube upload WITHOUT date (owner reviews in Studio)
        if: inputs.upload == true
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          M="publishing/queue/${ID}_ru.json"; F="longform/$ID/out/${ID}_ru.mp4"
          python - "$M" "$F" <<'PY'
          import json, sys, hashlib
          m = json.load(open(sys.argv[1], encoding='utf-8'))
          assert not m.get('publish_at'), 'NO-GO: manifest must have no date'
          assert m['source']['path'] == sys.argv[2], 'NO-GO: manifest path mismatch'
          h = hashlib.sha256(open(sys.argv[2], 'rb').read()).hexdigest()
          m['source']['sha256'] = h; json.dump(m, open(sys.argv[1], 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('sha', h)
          PY
          python scripts/youtube_direct.py check --manifest "$M"
          python scripts/youtube_direct.py preflight --manifest "$M" --video-file "$F"
          python scripts/youtube_direct.py reserve --manifest "$M"
          python scripts/youtube_direct.py send --manifest "$M" --video-file "$F"
          git config user.name youtube-direct-bot; git config user.email youtube-direct-bot@users.noreply.github.com
          git add publishing/receipts/ "$M"; git commit -m "youtube: private upload ${ID}_ru (no date)" || true
          git pull --rebase --autostash origin main && git push origin HEAD:main
