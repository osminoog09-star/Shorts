name: Scion host - approved Narrator2 Dmitry lip sync
on:
  push:
    branches: [codex/scion-weekly-s8d25-dima-sveta-20261028]
    paths: ['.github/workflows/scion-host-overlay.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg unzip
          cd studio
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Validate same Dima voice and generate actual Rhubarb visemes
        shell: bash
        run: |
          set -euo pipefail
          test -s videos/scion_weekly_20261028_dima_sveta_voicecut.mp4
          for i in $(seq -w 0 10); do
            test -s "tools/scion_weekly/work/$i.wav"
            test -s "tools/scion_weekly/work/$i.json"
          done
          python - <<'PY'
          import json, wave,hashlib
          from pathlib import Path
          root=Path('tools/scion_weekly/work')
          for i in range(11):
              meta=json.loads((root/f'{i:02d}.json').read_text())
              audio=root/f'{i:02d}.wav'
              assert hashlib.sha256(audio.read_bytes()).hexdigest()==meta['audio_sha256']
              expected='ru-RU-SvetlanaNeural' if i in (7,8) else 'ru-RU-DmitryNeural'
              assert meta['voice_id']==expected,(i,meta['voice_id'])
          print('11/11 voice hashes and role IDs PASS')
          PY
          bash tools/lipsync.sh tools/scion_weekly/work/00.wav tools/scion_weekly/work/intro_lipsync.json
          bash tools/lipsync.sh tools/scion_weekly/work/10.wav tools/scion_weekly/work/outro_lipsync.json
      - name: Render host in hook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tools/scion_weekly/work/intro_lipsync.json').read_text())
          Path('studio/src/host_corner.json').write_text(json.dumps({
            'fps':30,'duration':4.0,'visemes':x['visemes'][:125]
          }))
          PY
          cd studio
          npx remotion render src/index.ts host-corner ../tools/scion_weekly/work/host_intro.mov --codec=prores --prores-profile=4444 --pixel-format=yuva444p10le --concurrency=2
      - name: Render host in CTA with same narrator's actual audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,wave
          from pathlib import Path
          x=json.loads(Path('tools/scion_weekly/work/outro_lipsync.json').read_text())
          with wave.open('tools/scion_weekly/work/10.wav') as f:d=f.getnframes()/f.getframerate()
          Path('studio/src/host_corner.json').write_text(json.dumps({
            'fps':30,'duration':d+0.16,'visemes':x['visemes']
          }))
          PY
          cd studio
          npx remotion render src/index.ts host-corner ../tools/scion_weekly/work/host_outro.mov --codec=prores --prores-profile=4444 --pixel-format=yuva444p10le --concurrency=2
      - name: Mix approved host visually with approved main voices
        shell: bash
        run: |
          set -euo pipefail
          FINAL_START=$(python - <<'PY'
          import wave
          total=0.0
          for i in range(10):
              with wave.open(f'tools/scion_weekly/work/{i:02d}.wav') as f:
                  total+=0.16+f.getnframes()/f.getframerate()+0.4
          print('%.4f'%(total+0.16))
          PY
          )
          echo "Final-Dima-CTA-start=$FINAL_START"
          ffmpeg -y -v error -xerror \
            -i videos/scion_weekly_20261028_dima_sveta_voicecut.mp4 \
            -i tools/scion_weekly/work/host_intro.mov \
            -i tools/scion_weekly/work/host_outro.mov \
            -filter_complex "[1:v]crop=400:480:35:1065,scale=205:246:flags=lanczos,setpts=PTS-STARTPTS+0.16/TB,format=yuva420p[hi];[2:v]crop=400:480:35:1065,scale=205:246:flags=lanczos,setpts=PTS-STARTPTS+$FINAL_START/TB,format=yuva420p[ho];[0:v][hi]overlay=x=18:y=1010:format=auto:eof_action=pass:enable='between(t,0.16,4.16)'[tmp];[tmp][ho]overlay=x=18:y=1010:format=auto:eof_action=pass:enable='gte(t,$FINAL_START)'[v]" \
            -map "[v]" -map 0:a -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart videos/scion_weekly_20261028_dima_sveta_HOST_V2.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json videos/scion_weekly_20261028_dima_sveta_HOST_V2.mp4
          ffmpeg -v error -xerror -i videos/scion_weekly_20261028_dima_sveta_HOST_V2.mp4 -f null -
      - name: Upload new host cut for full editorial QA
        uses: actions/upload-artifact@v4
        with:
          name: scion-weekly-approved-dima-host-cut
          path: |
            videos/scion_weekly_20261028_dima_sveta_HOST_V2.mp4
            tools/scion_weekly/work/intro_lipsync.json
            tools/scion_weekly/work/outro_lipsync.json
            tools/scion_weekly/work/host_intro.mov
            tools/scion_weekly/work/host_outro.mov
          retention-days: 30
      - name: Commit new rendered cut to PR branch
        shell: bash
        run: |
          git config user.name m1lash-render-bot
          git config user.email m1lash-render-bot@users.noreply.github.com
          git add videos/scion_weekly_20261028_dima_sveta_HOST_V2.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'video: approved Narrator2 with Dmitry Rhubarb lip sync'
            git push origin HEAD:codex/scion-weekly-s8d25-dima-sveta-20261028
          else
            echo "Rendered host cut unchanged"
          fi
