name: M1lash Drive · folder intake
on:
  push:
    branches: [main]
    paths:
      - 'publishing/drive_folder.json'
      - 'publishing/clip_requests.json'
      - 'scripts/drive_folder_intake.py'
      - 'scripts/qa/test_drive_folder_intake.py'
      - '.github/workflows/drive-folder-intake.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drive-folder-intake
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install public-folder scanner
        run: pip install -q 'gdown>=6.1,<7'
      - name: Unit tests (URL allowlist, titles and scene gates)
        run: |
          python -m py_compile scripts/drive_folder_intake.py
          python -m unittest discover -s scripts/qa -p 'test_drive_folder_intake.py'
      - name: Scan names only, NEVER download films
        run: python scripts/drive_folder_intake.py
      - name: Commit scan summary
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'drive-scanner[bot]'
          git config user.email 'drive-scanner@users.noreply.github.com'
          git add publishing/drive_scan.json
          git diff --staged --quiet && exit 0
          git commit -m 'drive: refresh public folder inventory (metadata only)'
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
