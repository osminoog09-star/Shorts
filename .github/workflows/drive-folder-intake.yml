name: M1lash Drive · folder intake
on:
  push:
    branches: [main]
    paths:
      - 'publishing/drive_folder.json'
      - 'publishing/clip_requests.json'
      - 'scripts/drive_folder_intake.py'
      - 'scripts/qa/test_drive_folder_intake.py'
      - '.github/workflows/drive-folder-intake.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drive-folder-intake
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Unit tests (URL allowlist, titles, private auth and scene gates)
        run: |
          python -m py_compile scripts/drive_folder_intake.py
          python -m unittest discover -s scripts/qa -p 'test_drive_folder_intake.py'
      - name: Scan owner private Drive metadata (never download films)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/drive_folder_intake.py
      - name: Commit scan summary
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'drive-scanner[bot]'
          git config user.email 'drive-scanner@users.noreply.github.com'
          cp publishing/drive_scan.json "$RUNNER_TEMP/drive_scan.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/drive_scan.json" publishing/drive_scan.json
            git add publishing/drive_scan.json
            git diff --cached --quiet && exit 0
            git commit -q -m 'drive: refresh private folder inventory (metadata only)'
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
