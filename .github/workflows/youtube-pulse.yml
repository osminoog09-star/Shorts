name: YouTube · hourly pulse
# Ежечасно: живые счётчики (подписчики, просмотры свежих роликов) → ветка pulse-data → сайт и виджет.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-pulse
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Load previous pulse
        run: |
          git fetch -q origin pulse-data || true
          git show origin/pulse-data:pulse.json > /tmp/pulse.json 2>/dev/null || echo '{"snapshots":[]}' > /tmp/pulse.json
      - name: Snapshot counters (read-only)
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: python scripts/youtube_pulse.py /tmp/pulse.json
      - name: Save to pulse-data branch (main stays clean)
        run: |
          cd "$(mktemp -d)"
          git init -q && git checkout -q -b pulse-data
          cp /tmp/pulse.json pulse.json
          git config user.name 'M1lash pulse bot'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pulse.json && git commit -qm "pulse $(date -u +%FT%H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pulse-data
