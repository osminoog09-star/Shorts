name: M1LASH Ralph Dmitry Neural TTS
on:
  push:
    branches:
      - codex/m1lash-ralph-dmitry-voice-20261027
    paths:
      - .github/workflows/m1lash-ralph-dmitry-tts.yml
jobs:
  russian-neural-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edge TTS
        run: python -m pip install --disable-pip-version-check edge-tts==7.3.1
      - name: Generate all 13 scenes with Microsoft Dmitry
        shell: bash
        run: |
          mkdir -p dmitry
          python - <<'PY'
          import asyncio, json, pathlib, random
          import edge_tts
          text = json.loads("[\"Я нашёл способ, как не дать нейросети уйти с работы. И это не шутка.\",\"Представь: просишь ИИ исправить баг. Он пишет: готово.\",\"Запускаешь тест. А там всё красное.\",\"Обычно ты снова пишешь ему в чат.\",\"Но есть другой вариант: Ральф Луп для Клод Код.\",\"Это не новая супер-модель, а цикл.\",\"Агент исправляет код, запускает тесты и видит ошибку.\",\"Потом получает ту же задачу снова. И пробует ещё раз.\",\"Правки между попытками сохраняются. Вот это уже интересно.\",\"Цикл останавливается, когда выполнено условие. Или сработает лимит.\",\"Без лимита можно зря потратить время и токены.\",\"Поэтому ставь максимум десять попыток и чёткий критерий готовности.\",\"Сохрани ролик. А в комментариях напиши: доверил бы ты ИИ исправлять свой проект?\"]")
          async def main():
              success=[]
              for i,line in enumerate(text):
                  out=pathlib.Path("dmitry")/f"scene_{i:02}.mp3"
                  for attempt in range(1,13):
                      try:
                          if out.exists(): out.unlink()
                          await edge_tts.Communicate(text=line,voice="ru-RU-DmitryNeural",rate="+8%").save(str(out))
                          if out.stat().st_size < 4500: raise RuntimeError("empty TTS output")
                          print("SUCCESS",i,out.stat().st_size,flush=True)
                          success.append(i)
                          break
                      except Exception as e:
                          print("RETRY",i,attempt,type(e).__name__,str(e)[:110],flush=True)
                          await asyncio.sleep(min(3.0,0.5+attempt*.25))
                  else:
                      print("FAILED",i,flush=True)
              pathlib.Path("dmitry/manifest.json").write_text(json.dumps({"voice":"ru-RU-DmitryNeural","rate":"+8%","lines":text,"generated_indices":success},ensure_ascii=False,indent=2),encoding="utf-8")
              print("DONE",len(success),"/",len(text),flush=True)
              if len(success)!=len(text): raise RuntimeError("Not all segments generated")
          asyncio.run(main())
          PY
      - name: Upload Dmitry neural voice segments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-ralph-dmitry-neural
          path: dmitry/
          if-no-files-found: error
          retention-days: 7
