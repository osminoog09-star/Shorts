name: M1lash · Recover private movie Shorts from existing Actions artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/movie-shorts-private-recovery.yml'
      - 'jobs/movie-recovery/*.json'
      - 'scripts/qa/recover_movie_short.py'
      - 'scripts/qa/export_movie_review_assets.py'
  workflow_dispatch:
    inputs:
      job:
        description: 'jobs/movie-recovery/*.json'
        required: true
        default: 'jobs/movie-recovery/004_exmachina_v46.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: private-movie-short-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private movie QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q 'edge-tts>=7,<8' 'requests>=2.32,<3' 'numpy>=1.26,<3' 'Pillow>=10,<12'
      - name: Export only approved outro and Dima spoken titles for offline private QA
        run: |
          python3 scripts/qa/export_movie_review_assets.py
      - name: Build actual final MP4 (source in private runner only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_FILE: ${{ inputs.job }}
        run: |
          set -euo pipefail
          job="${JOB_FILE:-jobs/movie-recovery/004_exmachina_v46.json}"
          case "$job" in jobs/movie-recovery/*.json) ;; *) exit 1;; esac
          python3 scripts/qa/recover_movie_short.py "$job"
      - name: Record recoverable run id, status only
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('reports/research/movie_004_v46_recovery_run.json')
          p.write_text(json.dumps({'run_id':os.environ['RUN_ID'],
            'job_status':os.environ['RUN_STATUS'],
            'media_in_github':'NO',
            'human_visual_review':'PENDING',
            'youtube_upload':'NO'},indent=2)+'\n')
          PY
          git config user.name 'm1lash-recovery-bot'
          git config user.email 'm1lash-recovery-bot@users.noreply.github.com'
          git add reports/research/movie_004_v46_recovery_run.json
          git commit -m "qa: movie 004 V46 recovery CI status only"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Save private review files (no YouTube and no Git commit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movie-short-private-recovery-${{ github.run_id }}
          path: |
            recovery-output/
          retention-days: 14
          if-no-files-found: warn
