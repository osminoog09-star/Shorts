name: Roman concrete voice (Dima)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roman-concrete-voice
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: pip install -q "edge-tts>=7,<8"
      - name: Synthesize (partial results are kept)
        run: python scripts/roman_concrete_tts.py || echo "PARTIAL=1" >> $GITHUB_ENV
      - name: Commit voice
        run: |
          git config user.name tts-bot; git config user.email tts-bot@users.noreply.github.com
          git add media/tts/roman_concrete
          if ! git diff --cached --quiet; then git commit -qm "tts: roman concrete Dima voice"; for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done; fi
          if [ "${PARTIAL:-0}" = 1 ]; then echo "partial — rerun"; exit 1; fi
