name: M1lash YouTube · one-time approved editorial reschedule 04.11
on:
  push:
    branches: [main]
    paths:
      - 'publishing/schedule_migrations/2026-11-04_editorial.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m1lash-one-time-2026-11-04-editorial
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32,<3'
      - name: Execute 7 explicit owner-approved migrations (no upload, no public)
        id: migrate
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: python scripts/qa/apply_editorial_migration_20261104.py
      - name: Persist receipts even on partial failure for safe recovery
        if: always()
        run: |
          set -euo pipefail
          git config user.name youtube-direct-bot
          git config user.email youtube-direct-bot@users.noreply.github.com
          git add publishing/receipts/
          if git diff --cached --quiet; then
            echo 'No receipt changes'
          else
            git commit -m 'youtube: record verified reschedules from owner 04.11 policy'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
