name: Motion Studio · render MP4
on:
  push:
    paths: ['jobs/motion/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'Job JSON path inside jobs/motion/'
        required: true
        default: 'jobs/motion/demo.json'
permissions:
  contents: read
concurrency:
  group: motion-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'edge-tts>=7,<8' 'playwright>=1.48,<2' 'requests>=2.32,<3'
      - run: python -m playwright install --with-deps chromium
      - name: Install MP4 encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render requested jobs
        env:
          REQUESTED_JOB: ${{ inputs.job }}
          BEFORE: ${{ github.event.before }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          if os.environ.get('REQUESTED_JOB'):
              jobs=[os.environ['REQUESTED_JOB']]
          else:
              before=os.environ.get('BEFORE','')
              # Shallow PR/branch checkouts may not contain the before SHA. Retry
              # with the changed files in HEAD for this single-push job branch.
              if before and subprocess.run(['git','cat-file','-e',before],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0:
                  jobs=subprocess.check_output(['git','diff','--name-only',before,'HEAD','--','jobs/motion/']).decode().splitlines()
              else:
                  jobs=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD','--','jobs/motion/']).decode().splitlines()
          if not jobs and os.environ.get('GITHUB_REF_NAME') == 'codex/price-gap-20261027':
              # Isolated production retry: shallow checkout omitted the before commit.
              jobs=['jobs/motion/m1lash_price_gap_20261027_ru.json']
          if not jobs:
              raise RuntimeError('No motion jobs selected. Do not report a successful render.')
          for job in jobs[:2]:
              p=Path(job)
              if p.parent.as_posix()!='jobs/motion' or p.suffix!='.json' or not p.is_file():raise ValueError('Invalid job path')
              subprocess.run(['python','motion-studio/automation/render.py',str(p),'motion-output'],check=True)
              output=Path('motion-output')/(p.stem+'.mp4')
              if not output.is_file() or output.stat().st_size < 100000:
                  raise RuntimeError('Expected rendered MP4 was not produced: '+str(output))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-videos-${{ github.run_id }}
          path: motion-output/
          retention-days: 14
