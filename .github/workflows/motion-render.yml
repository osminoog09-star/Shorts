name: Motion Studio · render MP4
on:
  push:
    paths: ['jobs/motion/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'Job JSON path inside jobs/motion/'
        required: true
        default: 'jobs/motion/demo.json'
permissions:
  contents: write
concurrency:
  group: motion-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'edge-tts>=7,<8' 'playwright>=1.48,<2' 'requests>=2.32,<3' 'pillow>=10,<12' 'numpy>=1.26,<3'
      - run: python -m playwright install --with-deps chromium
      - name: Install MP4 encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render requested jobs
        env:
          REQUESTED_JOB: ${{ inputs.job }}
          BEFORE: ${{ github.event.before }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          if os.environ.get('REQUESTED_JOB'):
              jobs=[os.environ['REQUESTED_JOB']]
          else:
              subprocess.run(['git','fetch','--depth=2','origin','main'],check=True)
              jobs=subprocess.check_output(['git','diff','--name-only',os.environ['BEFORE'],'HEAD','--','jobs/motion/']).decode().splitlines()
          for job in jobs[:2]:
              p=Path(job)
              if p.parent.as_posix()!='jobs/motion' or p.suffix!='.json' or not p.is_file():raise ValueError('Invalid job path')
              import json
              spec=json.loads(p.read_text(encoding='utf-8'))
              if spec.get('renderer')=='python':
                  script=Path(spec.get('script',''))
                  output=Path(spec.get('output',''))
                  if not script.as_posix().startswith('shorts/') or script.suffix!='.py' or not script.is_file():raise ValueError('Invalid approved render script')
                  if not output.as_posix().startswith('videos/') or output.suffix!='.mp4':raise ValueError('Invalid output path')
                  # If source speech was not committed by the TTS workflow yet,
                  # synthesize the same whitelisted Dima/Sveta job locally in CI.
                  tts_job=Path(spec.get('tts_job',''))
                  if tts_job.as_posix().startswith('jobs/tts/') and tts_job.suffix=='.json' and tts_job.is_file():
                      stem=tts_job.stem
                      voice_dir=Path('media/tts')/stem
                      ref=json.loads(tts_job.read_text(encoding='utf-8'))
                      def needs_voice(l):
                          mp3=voice_dir/(l['id']+'.mp3')
                          meta=voice_dir/(l['id']+'.json')
                          if not mp3.is_file() or not meta.is_file():return True
                          try:
                              m=json.loads(meta.read_text(encoding='utf-8'))
                              return m.get('text')!=l['text'] or m.get('voice_id')!=l.get('voice',ref['voice']) or m.get('rate')!=l.get('rate',ref.get('rate','+0%'))
                          except (OSError,ValueError):return True
                      missing=any(needs_voice(l) for l in ref['lines'])
                      if missing:
                          print('Approved TTS assets missing; requesting via existing validated script',flush=True)
                          subprocess.run(['python','scripts/tts_job.py',str(tts_job)],check=True)
                  subprocess.run(['python',str(script)],check=True)
                  if not output.is_file() or output.stat().st_size<200000:raise RuntimeError('Python render did not produce MP4')
                  # Full decode & formal stream gate before any review-only save.
                  import json as jsonmod
                  probe=jsonmod.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name,width,height','-of','json',str(output)]))
                  duration=float(probe['format']['duration'])
                  vs=[v for v in probe['streams'] if v['codec_type']=='video']
                  au=[a for a in probe['streams'] if a['codec_type']=='audio']
                  if not vs or not au or vs[0].get('width')!=1080 or vs[0].get('height')!=1920 or not 33<=duration<=65:raise RuntimeError('NO-GO: video profile, audio or duration invalid')
                  subprocess.run(['ffmpeg','-v','error','-i',str(output),'-f','null','-'],check=True)
                  print('Full MP4 decode OK; seconds=',duration,flush=True)
                  Path('motion-output').mkdir(exist_ok=True)
                  import shutil
                  shutil.copy2(output,Path('motion-output')/output.name)
              else:
                  subprocess.run(['python','motion-studio/automation/render.py',str(p),'motion-output'],check=True)
          PY
      - name: Save new review-only MP4 into repo when explicitly requested
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,os,json
          from pathlib import Path
          if os.environ.get('REQUESTED_JOB'):
              jobs=[os.environ['REQUESTED_JOB']]
          else:
              jobs=subprocess.check_output(['git','diff','--name-only',os.environ['BEFORE'],'HEAD','--','jobs/motion/']).decode().splitlines()
          for p in jobs[:2]:
              path=Path(p)
              if path.parent.as_posix()!='jobs/motion' or path.suffix!='.json' or not path.is_file():continue
              cfg=json.loads(path.read_text())
              if cfg.get('renderer')=='python' and cfg.get('save_review_mp4'):
                  video=Path(cfg['output'])
                  if not video.is_file():raise RuntimeError('Expected review MP4 missing')
                  subprocess.run(['git','add','--',str(video)],check=True)
          PY
          # Temporary synthesized speech must not block rebase when TTS-bot added it upstream.
          git restore -- media/tts/ || true
          git clean -fd -- media/tts/ || true
          if ! git diff --cached --quiet; then
            git config user.name "m1lash-render-bot"
            git config user.email "m1lash-render-bot@users.noreply.github.com"
            git commit -m "video: save private-review MP4"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-videos-${{ github.run_id }}
          path: motion-output/
          retention-days: 14
