name: Android widget APK
on:
  push:
    branches: [main]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK (постоянный ключ из секретов, если он есть)
        working-directory: android-widget
        env:
          KS_B64: ${{ secrets.WIDGET_KEYSTORE_B64 }}
          WIDGET_KEYSTORE_PASSWORD: ${{ secrets.WIDGET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${WIDGET_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Permanent signing secrets are missing. Refusing to publish a debug-signed release."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/m1w.jks"
          chmod 600 "$RUNNER_TEMP/m1w.jks"
          export WIDGET_KEYSTORE="$RUNNER_TEMP/m1w.jks"
          keytool -list -keystore "$WIDGET_KEYSTORE" -storepass:env WIDGET_KEYSTORE_PASSWORD -alias m1lash >/dev/null
          trap 'rm -f "$RUNNER_TEMP/m1w.jks"' EXIT
          gradle --no-daemon :app:assembleRelease
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android-widget/app/build/outputs/apk/release/app-release.apk m1lash-widget.apk
          gh release delete widget --yes --cleanup-tag 2>/dev/null || true
          gh release create widget m1lash-widget.apk --title "M1lash виджет" --notes "Android-виджет студии M1lash. Скачать APK на телефон и установить."
