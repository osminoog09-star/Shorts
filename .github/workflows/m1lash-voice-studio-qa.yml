name: M1lash Voice Studio - offline isolated unit tests
on:
  push:
    paths:
      - 'tools/voice_studio/**'
      - 'tests/test_m1lash_voice_studio.py'
      - '.github/workflows/m1lash-voice-studio-qa.yml'
  pull_request:
    paths:
      - 'tools/voice_studio/**'
      - 'tests/test_m1lash_voice_studio.py'
      - '.github/workflows/m1lash-voice-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax, model-free audio and reference QA
        run: |
          python -m py_compile tools/voice_studio/m1lash_voice.py tools/studio/production_inputs.py tools/studio/chunk_manifest.py
          python -m unittest discover -s tests -p 'test_m1lash_voice_studio.py' -v
          python -m unittest discover -s tests -p 'test_m1lash_production_inputs.py' -v
          python tools/voice_studio/m1lash_voice.py list
