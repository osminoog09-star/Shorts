name: M1lash prompt registry and composer tests
on:
  push:
    paths: ['prompts/m1lash/**','tools/studio/prompt_compose.py','tests/test_m1lash_prompt_compose.py']
  pull_request:
    paths: ['prompts/m1lash/**','tools/studio/prompt_compose.py','tests/test_m1lash_prompt_compose.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_m1lash_prompt_compose.py' -v
          python tools/studio/prompt_compose.py --style X01 --format long --duration 1260 --topic "Проверенный технический сюжет" > /dev/null
