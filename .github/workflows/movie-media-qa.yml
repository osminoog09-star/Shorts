name: M1lash movie source RU QA and private approved assets
on:
  push:
    branches: [main]
    paths:
      - 'jobs/mediaqa/*.json'
      - 'scripts/qa/movie_artifact_ru_audio.py'
      - '.github/workflows/movie-media-qa.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'jobs/mediaqa/*.json'
        required: true
        default: 'jobs/mediaqa/chigur_004_ru_source.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: movie-media-qa-assets-v2
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q 'faster-whisper>=1,<2' 'requests>=2.32,<3' 'edge-tts>=7,<8'
      - name: Export private approved outro and Dima titles
        run: |
          mkdir -p recovery-output/studio-assets
          timeout 180s python3 scripts/qa/export_movie_review_assets.py || echo 'TTS incomplete; retain approved outro if copied'
          cp -a skills/ext/ffmpeg-skill/scripts recovery-output/studio-assets/ffmpeg_qa_scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-private-assets-${{ github.run_id }}
          path: recovery-output/studio-assets/
          retention-days: 14
      - name: Sample only newly changed source ASR job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          job="${INPUT_JOB:-}"
          if [ -z "$job" ]; then
            job="$(git diff --name-only HEAD^ HEAD -- jobs/mediaqa/ | grep -E '^jobs/mediaqa/[^/]+[.]json$' | head -n 1 || true)"
          fi
          if [ -z "$job" ]; then echo 'No new source ASR job'; exit 0; fi
          case "$job" in jobs/mediaqa/*.json) ;; *) echo 'Invalid job'; exit 1;; esac
          python scripts/qa/movie_artifact_ru_audio.py --job "$job"
      - name: Write private asset run reference
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/research
          printf '{"run_id":"%s","artifacts":"studio-private-assets-%s","private":true}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" > reports/research/movie_review_assets_run.json
          git config user.name 'movie-source-qa[bot]'
          git config user.email 'movie-source-qa@users.noreply.github.com'
          git add reports/research/movie_review_assets_run.json
          git add reports/research/*_SOURCE_RU_ASR.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -qm 'qa: private approved-outro and Dima titles artifact run'
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
