name: "M1lash AI scandals — final private MP4"
on:
  push:
    branches: [codex/ai-scandals-s7d25-final]
    paths:
      - 'tools/ai_scandals_s7d25.py'
      - 'jobs/ai-news/trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Python packages
        run: |
          python -m pip install --quiet pillow "edge-tts>=7,<8" imageio-ffmpeg mutagen
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ffmpeg" -version | head -1
      - name: Render voice and motion video
        run: python tools/ai_scandals_s7d25.py
      - name: Upload full video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1lash-ai-scandals-final-mp4
          path: |
            videos/ai_scandals_20261027_s7d25_ru.mp4
            videos/ai_scandals_20261027_s7d25_cover.jpg
            export_ai_news/probe.json
          retention-days: 14
      - name: Commit final MP4 to branch
        if: success()
        run: |
          git config user.name "m1lash-render-bot"
          git config user.email "m1lash-render-bot@users.noreply.github.com"
          git add videos/ai_scandals_20261027_s7d25_ru.mp4 videos/ai_scandals_20261027_s7d25_cover.jpg
          git commit -m "video: finished AI scandals S7-D25 RU" || exit 0
          git push origin HEAD:codex/ai-scandals-s7d25-final
