name: Трек · голос Дениса + свой бит (PRIVATE Drive)
# Общий workflow: читка из artifact run denis-voice-tts + процедурный бит tools/track/make_track.py.
# Голос и готовый трек не попадают в Git; результат — только в приватный Google Drive владельца.
on:
  workflow_dispatch:
    inputs:
      voice_run: { description: 'run id denis-voice-tts с v01…vNN.wav', required: true }
      plan: { description: 'tools/track/<plan>.json', required: true, default: 'tools/track/razdva.json' }
permissions:
  contents: read
  actions: read
concurrency: { group: voice-track-mix, cancel-in-progress: false }
jobs:
  mix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ inputs.plan }}
      VOICE_RUN: ${{ inputs.voice_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          set -euo pipefail
          case "$PLAN" in tools/track/*.json) ;; *) echo '::error::plan must be tools/track/<name>.json'; exit 1;; esac
          case "$VOICE_RUN" in ''|*[!0-9]*) echo '::error::voice_run must be a number'; exit 1;; esac
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q numpy scipy
      - name: Private voice from artifact (not committed)
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/voices"; mkdir -p "$V/dl"
          gh run download "$VOICE_RUN" -R "$GITHUB_REPOSITORY" -D "$V/dl"
          find "$V/dl" -name 'v[0-9][0-9].wav' -exec cp {} "$V/" \;
          ls "$V"/*.wav | wc -l
          python - "$V/dl" <<'PY'
          import json,sys,pathlib
          for m in pathlib.Path(sys.argv[1]).rglob('manifest.json'):
              for u in json.load(open(m)).get('utterances',[]):
                  print('ASR',u['id'],u.get('asr_similarity'))
          PY
      - name: Beat + vocal mix
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          python tools/track/make_track.py "$RUNNER_TEMP/voices" "$O" --plan "$PLAN"
          ID="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$PLAN")"
          echo "TRACK_ID=$ID" >> "$GITHUB_ENV"
          ffmpeg -v error -y -i "$O/$ID.wav" -b:a 256k "$O/$ID.mp3"
          ffmpeg -hide_banner -nostats -i "$O/$ID.wav" -af ebur128 -f null - 2>&1 | grep -E ' I:|LRA:' | tail -2 | tee "$O/lufs.txt"
          ffmpeg -v error -i "$O/$ID.mp3" -f null - && echo DECODE_OK
          python - "$O" <<'PY'
          import json,sys,pathlib
          o=pathlib.Path(sys.argv[1]); r=json.load(open(o/'report.json'))
          lufs=' '.join(open(o/'lufs.txt').read().split())
          tempos=[l['tempo'] for l in r['lines']]
          print('::notice title=TRACK_QA::dur=%s peak=%s rms=%s voice-beat=%sdB all_fit=%s max_tempo=%s %s' % (
              r['duration'],r['peak_db'],r['rms_db'],r['voice_minus_beat_db'],r['all_fit'],max(tempos),lufs))
          print('::notice title=TRACK_LINES::'+' | '.join('%s.%s %ss x%s' % (l['id'],l['part'],l['sec'],l['tempo']) for l in r['lines']))
          PY
      - name: Owner copy → private Google Drive (not Git, not YouTube)
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          python scripts/drive_private_upload.py --folder "${TRACK_ID}_run${{ github.run_number }}" \
            "$O/$TRACK_ID.mp3" "$O/$TRACK_ID.wav" "$O/report.json"
          python - <<'PY'
          import json
          j=json.load(open('drive_review_receipt.json'))
          print('::notice title=TRACK_DRIVE::'+j['folder_url'])
          for f in j['files']:
              if f['name'].endswith('.mp3'): print('::notice title=TRACK_MP3::'+f['url'])
          PY
