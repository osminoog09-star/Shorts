name: M1lash Shorts · export approved voice/outro for local reconstruction
on:
  push:
    branches: [main]
    paths: ['jobs/shorts-rebuild/assets_approved.json']
permissions:
  contents: write
jobs:
  approved_assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Approved voices
        run: |
          pip install -q 'edge-tts>=7,<8'
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p qa-assets/media/outro qa-assets/voice qa-assets/tools qa-assets/ffmpeg-skill
          cp media/outro/m1lash_outro_v1_vertical.mp4 qa-assets/media/outro/
          cp tools/assemble_with_outro.py qa-assets/tools/
          cp -a skills/ext/ffmpeg-skill/. qa-assets/ffmpeg-skill/
          python - <<'PY'
          import asyncio,edge_tts,pathlib,json,subprocess
          voices={'001':'Старикам тут не место','002':'Старикам тут не место','003':'Одержимость','004':'Из машины','005':'Стрингер','006':'Интерстеллар'}
          async def make():
              for k,v in voices.items():
                  target=pathlib.Path('qa-assets/voice')/(k+'_title.mp3')
                  await edge_tts.Communicate('Это был фильм… '+v+'.','ru-RU-DmitryNeural',rate='+8%').save(str(target))
                  subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(target)],check=True)
                  (pathlib.Path('qa-assets/voice')/(k+'_title.json')).write_text(json.dumps({'voice_id':'ru-RU-DmitryNeural','engine':'edge-tts','rate':'+8%','film':v},ensure_ascii=False))
          asyncio.run(make())
          PY
          ffprobe -v error -show_entries format=duration -of csv=p=0 qa-assets/media/outro/m1lash_outro_v1_vertical.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: approved-movie-shorts-outro-voice-${{ github.run_id }}
          path: qa-assets/
          retention-days: 14
      - name: Save run pointer
        env:
          GH_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('reports/research/shorts_approved_assets_run.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'run_id':os.environ['GH_RUN'],'stage':'approved_outro_and_6_Dima_title_tracks'},indent=2))
          PY
          git config user.name shorts-asset-bot
          git config user.email shorts-asset-bot@users.noreply.github.com
          git add reports/research/shorts_approved_assets_run.json
          git commit -m 'qa: approved Shorts assets export run'
          for i in 1 2 3; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi; sleep 4; done
          exit 1
