name: Heron final native exports
on:
  push:
    paths: ['.github/workflows/heron_finish_native.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: heron-final-native
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the shared narrator
        run: |
          for I in $(seq 1 100); do
            git fetch -q origin main
            COUNT=$(git ls-tree -r --name-only origin/main -- media/tts/heron_finish | wc -l)
            if [ "$COUNT" -ge 6 ]; then git checkout origin/main -- media/tts/heron_finish; exit 0; fi
            sleep 10
          done
          exit 1
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install numpy
          python3 longform/heron-codex/make_native.py
      - id: matrix
        run: echo "matrix=$(cat longform/heron-codex/native_matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: heron-native-assets
          path: |
            longform/heron-codex/native_*.wav
            longform/heron-codex/timeline-*.json
            longform/heron-codex/native.json
          retention-days: 3
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: heron-native-assets
          path: longform/heron-codex
      - run: |
          npm ci --prefix longform/heron-codex
          node longform/heron-codex/node_modules/playwright-core/cli.js install --with-deps chromium
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - name: Render native camera
        env:
          CLIP: ${{ matrix.clip }}
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
          FRAMES: ${{ matrix.frames }}
        run: |
          cd longform/heron-codex
          read FROM TO < <(python3 -c 'import os; n=int(os.environ["FRAMES"]); p=int(os.environ["PART"]); q=int(os.environ["PARTS"]); print((n*p//q)/30,(n*(p+1)//q)/30)')
          node render.mjs --clip "$CLIP" --fps 30 --from "$FROM" --to "$TO" --out "out/native_${CLIP}_${PART}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: native-part-${{ matrix.clip }}-${{ matrix.part }}
          path: longform/heron-codex/out/native_*.mp4
          retention-days: 3
  finish:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heron-voice
          run-id: 40074892695
          github-token: ${{ github.token }}
          path: longform/heron-codex
      - uses: actions/download-artifact@v4
        with:
          pattern: heron-part-*
          run-id: 40074892695
          github-token: ${{ github.token }}
          merge-multiple: true
          path: longform/heron-codex/shards
      - uses: actions/download-artifact@v4
        with:
          name: heron-native-assets
          path: longform/heron-codex
      - uses: actions/download-artifact@v4
        with:
          pattern: native-part-*
          merge-multiple: true
          path: longform/heron-codex/native_shards
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install numpy pillow
          python3 longform/heron-codex/finish_native.py
          python3 longform/heron-codex/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: heron-final-delivery
          path: longform/heron-codex/out/heron_*
          retention-days: 7
      - name: Publish files for review and commit exact deliveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="heron-final-${GITHUB_RUN_ID}"
          gh release create "$TAG" longform/heron-codex/out/heron_*.mp4 longform/heron-codex/out/heron_qa* longform/heron-codex/out/heron_thumbnail.jpg longform/heron-codex/out/heron_metadata.json --title 'Heron: full film and two native portrait Shorts' --notes 'Original educational 3D reconstruction; free shared Dmitry narration, original procedural score. Technical validation passed. Visual review is recorded separately in the project.'
          mkdir -p videos
          cp longform/heron-codex/out/heron_*.mp4 videos/
          cp longform/heron-codex/out/heron_thumbnail.jpg videos/
          cp longform/heron-codex/out/heron_qa.json longform/heron-codex/EXPORT_QA.json
          cp longform/heron-codex/out/heron_metadata.json longform/heron-codex/EXPORT_METADATA.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/heron_ancient_automation_ru.mp4 videos/heron_short_coin_ru.mp4 videos/heron_short_steam_ru.mp4 videos/heron_thumbnail.jpg longform/heron-codex/EXPORT_QA.json longform/heron-codex/EXPORT_METADATA.json longform/heron-codex/timeline.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deliver Heron film and two native portrait Shorts with voiced endings'
          for I in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; done
          exit 1
