version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "npm"
    directory: "/longform/roman-concrete"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/tools/free_video"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
