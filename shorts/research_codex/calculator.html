<!doctype html><html lang="ru"><meta charset="utf-8"><title>Калькулятор смены — прототип эксперимента</title><style>body{font:20px system-ui;background:#eef2f8;max-width:650px;margin:60px auto;padding:30px}label{display:block;margin:18px}input{float:right;font:inherit;width:150px}output{font-size:40px;color:#3057b8}article{background:white;padding:32px;border-radius:24px}</style><article><h1>Смена: после топлива</h1><label>Выручка, € <input id="revenue" type="number" value="120"></label><label>Пробег, км <input id="km" type="number" value="100"></label><label>Расход, л/100 км <input id="fuel" type="number" value="6"></label><label>Цена, €/л <input id="price" type="number" step="0.01" value="1.6"></label><p>Остаток после топлива</p><output id="result"></output><p>Учебный прототип. Комиссии, налоги и износ не включены. Это не расчёт чистой прибыли.</p></article><script>function calculate(){const v=id=>Math.max(0,Number(document.getElementById(id).value)||0);const cost=v('km')*v('fuel')/100*v('price');const net=v('revenue')-cost;document.getElementById('result').textContent=net.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';return {cost,net}}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calculate));window.calculate=calculate;calculate()</script></html>
