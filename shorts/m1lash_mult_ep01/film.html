<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101522;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%}#stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 74% 67% at 50% 39%,transparent 38%,rgba(6,10,21,.38) 97%),linear-gradient(to bottom,rgba(5,8,19,.28),transparent 23%,transparent 62%,rgba(3,8,22,.65) 100%)}
#top{position:absolute;top:72px;left:72px;color:#e0e8fa;font-size:28px;font-weight:900;letter-spacing:10px;text-shadow:0 2px 18px #02040d}
#slogan{position:absolute;top:185px;left:58px;right:65px;font-size:65px;font-weight:1000;line-height:1.06;letter-spacing:-2px;text-shadow:0 8px 22px #050713,0 3px #0b1320;color:white}
#tag{position:absolute;bottom:390px;left:72px;right:120px;font-size:44px;font-weight:900;color:#dcf5ff;text-shadow:0 4px 14px #020815}
#status{position:absolute;bottom:236px;left:72px;color:#9edfe2;font-size:25px;letter-spacing:7px;font-weight:800}
</style></head>
<body>
<div id="stage"></div><div id="top">M1LASH МУЛЬТ</div><div id="slogan"></div><div id="tag"></div><div id="status">ЧЕЛОВЕК ПРОТИВ ИИ · 01</div>
<script src="./three.min.js"></script>
<script>
"use strict";
let renderer,scene,camera,clock=0, mil,aks,badge,desk,chair,computer,phone,printer,forms=[],checks=[],coin,meeting=[],socket,wire;
const W=1080,H=1920, PI=Math.PI;
function mat(c,r=.55,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
const M={wall:mat(0x182239,.83),floor:mat(0x1c2c43,.7),desk:mat(0x38526a,.4),deskEdge:mat(0xa7b3c6,.32,.5),skin:mat(0xd8a387,.79),hair:mat(0x26232c,.9),jacket:mat(0x278e99,.69),jacketDark:mat(0x174e63,.7),trousers:mat(0x333a4d,.83),shoes:mat(0x111d2c,.52),shirt:mat(0xedbb77,.86),steel:mat(0x8993ba,.25,.8),brass:mat(0xc9a063,.31,.65),navy:mat(0x222d56,.28,.26),lilac:mat(0x6255ba,.29,.4),eyes:mat(0x8cecff,.14,.6),ink:mat(0x13182a,.65),white:mat(0xf5f1e9,.4),paper:mat(0xe5ebf2,.8),red:mat(0xf45562,.42),green:mat(0x76e0bd,.5)};
function box(w,h,d,x,y,z,m,group){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;(group||scene).add(o);return o}
function ico(r,x,y,z,m,group,detail=1){const o=new THREE.Mesh(new THREE.IcosahedronGeometry(r,detail),m);o.position.set(x,y,z);o.castShadow=true;(group||scene).add(o);return o}
function cyl(r1,r2,h,x,y,z,m,group,seg=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y,z);o.castShadow=true;(group||scene).add(o);return o}
function ring(r,tor,x,y,z,m,group){const o=new THREE.Mesh(new THREE.TorusGeometry(r,tor,9,72),m);o.position.set(x,y,z);(group||scene).add(o);return o}
function joint(a,b,r,m,group){const p=new THREE.Vector3(...a),q=new THREE.Vector3(...b),d=q.clone().sub(p);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),9),m);o.position.copy(p.add(q).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;(group||scene).add(o);return o}
function human(){
 const root=new THREE.Group();root.position.set(-1.3,.35,-.5);scene.add(root);
 const legs=new THREE.Group();root.add(legs);
 for(let s of [-1,1]){joint([s*.31,.92,0],[s*.35,-.16,.14],.19,M.trousers,legs);box(.43,.22,.83,s*.35,-.2,.33,M.shoes,legs)}
 // jacket with layered seam, collar and cuffs
 const torso=box(1.34,1.63,.74,0,1.75,0,M.jacket,root);
 box(.47,1.35,.053,0,1.75,.40,M.shirt,root);
 box(.1,1.46,.09,-.17,1.75,.45,M.jacketDark,root);
 box(.09,1.46,.09,.18,1.75,.45,M.jacketDark,root);
 for(let s of [-1,1]){
   joint([s*.69,2.27,0],[s*.93,1.37,.17],.21,M.jacket,root);
   joint([s*.93,1.37,.17],[s*.77,.9,.37],.145,M.skin,root);
   ico(.17,s*.77,.85,.37,M.skin,root,1);
   box(.13,.07,.11,s*.68,2.22,.36,M.brass,root);
 }
 const head=new THREE.Group();head.position.set(0,3.18,.06);root.add(head);
 ico(.77,0,0,0,M.skin,head,2);
 // angular hair silhouette; lock to avoid generic sphere
 const hair=ico(.81,0,.27,-.11,M.hair,head,1);hair.scale.set(1.05,.66,1.04);
 for(let i=0;i<5;i++){const h=ico(.21,-.54+i*.28,.59+(i%2)*.04,.42,M.hair,head,0);h.rotation.z=.15+i*.1}
 for(let s of [-1,1]){
   const eye=ico(.115,s*.29,.065,.70,M.white,head,1);eye.scale.set(.88,1.2,.55);
   const pupil=ico(.049,s*.29,.055,.77,M.ink,head,1);
   const brow=box(.32,.08,.085,s*.28,.28,.71,M.hair,head);brow.rotation.z=s*.08;
   ico(.16,s*.70,-.05,0,M.skin,head,1);
 }
 const mouth=box(.31,.055,.09,0,-.34,.69,M.ink,head);
 return {root,head,mouth,hair};
}
function ai(){
 const root=new THREE.Group();root.position.set(1.35,2.05,.4);scene.add(root);
 const core=ico(.79,0,0,0,M.navy,root,1);core.scale.set(1.22,.96,.82);
 // orbital collar, ring mounts, metallic seam. NOT orange and NO feet.
 let outer=ring(1.0,.026,0,-.05,0,M.brass,root);outer.rotation.set(1.25,.2,.2);
 let orbit=ring(.99,.018,0,0,0,M.steel,root);orbit.rotation.set(.3,.7,.3);
 const visor=box(1.37,.45,.15,0,.11,.63,M.lilac,root);
 for(let s of [-1,1]){let eye=ico(.16,s*.31,.13,.77,M.eyes,root,0);eye.scale.set(.76,.90,.36)}
 const smile=ring(.21,.025,0,-.20,.75,M.eyes,root);smile.rotation.x=.06;smile.scale.set(1,.44,1);
 const antenna=joint([0,.7,0],[0,1.12,0],.047,M.steel,root);
 ico(.13,0,1.20,0,M.brass,root,1);
 for(let s of [-1,1]){let side=ico(.24,s*.98,-.04,0,M.lilac,root,0);side.scale.set(.6,.56,.85)}
 return {root,core,orbit,outer,smile,visor};
}
function room(){
 scene.background=new THREE.Color(0x0e1525);
 box(18,.4,15,0,-.37,-2.5,M.floor);
 box(18,14,.27,0,5.6,-6.3,M.wall);
 for(let x of [-5,0,5]){box(.09,9,.1,x,4.4,-6.05,M.deskEdge);box(4.5,.09,.1,x+2.5,4.6,-6.04,M.deskEdge)}
 // wall window/panorama, subtle city
 box(8,5.7,.06,0,5.8,-5.95,mat(0x163c56,.65));
 for(let i=0;i<16;i++){const h=.5+(i*7%9)*.23;box(.33+(i%3)*.1,h,.1,-3.7+i*.49,3.3+h/2,-5.85,mat(i%3?0x28445e:0x3a6177,.72))}
 const lamp=new THREE.PointLight(0x99c9ff,.86,14);lamp.position.set(-2.8,6.5,3.2);scene.add(lamp);
 const key=new THREE.DirectionalLight(0xffe0bb,1.18);key.position.set(-5,8,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=9;key.shadow.camera.bottom=-9;scene.add(key);
 const rim=new THREE.DirectionalLight(0x6f8cfa,1.18);rim.position.set(3,6,-4);scene.add(rim);
 scene.add(new THREE.HemisphereLight(0xa5c5ff,0x283147,.52));
 // main desk in foreground
 desk=new THREE.Group();desk.position.set(0,.4,1.3);scene.add(desk);
 box(6.9,.27,2.5,0,1.05,0,M.desk,desk);
 for(let s of [-1,1])box(.27,1.7,.25,s*2.92,.15,0,M.deskEdge,desk);
 computer=new THREE.Group();desk.add(computer);computer.position.set(2.48,-.08,-1.32);const screen=box(1.50,.96,.12,0,2.11,0,M.ink,computer);screen.rotation.y=-.26;
 const panel=box(1.34,.79,.025,0,2.12,.082,mat(0x20445a,.35,.25),computer);panel.rotation.y=-.26;
 box(.12,.34,.14,0,1.45,0,M.steel,computer);
 box(.88,.06,.40,0,1.28,0,M.steel,computer);
 for(let x=-7;x<8;x++){box(.115,.035,.095,-.15+x*.14,1.24,.65,M.ink,desk)}
 chair=new THREE.Group();chair.position.set(-2.2,0,-1.7);scene.add(chair);
 box(1.6,1.9,.26,0,1.65,0,M.trousers,chair);box(1.8,.2,1.2,0,.9,.3,M.trousers,chair);
 phone=new THREE.Group();phone.position.set(1.9,1.54,1.35);scene.add(phone);box(.75,1.3,.095,0,0,0,M.ink,phone);box(.65,1.16,.02,0,0,.07,M.eyes,phone);
 printer=new THREE.Group();printer.position.set(2.2,1.72,.0);scene.add(printer);
 box(1.7,.83,1.33,0,0,0,M.steel,printer);box(1.2,.05,.5,0,.48,-.07,M.ink,printer);
 coin=cyl(.38,.38,.11,1.1,2.65,1.15,M.brass,scene,24);coin.rotation.x=PI/2;
 socket=box(.52,.7,.06,2.75,.72,-.8,M.white);wire=joint([2.75,.7,-.7],[2.25,.5,1.0],.055,M.ink);
 for(let i=0;i<8;i++){const m=box(1.3,.06,.9,-2.3+i*.19,2.6+i*.025,-.6,M.paper);m.rotation.y=i*.11;meeting.push(m)}
 for(let i=0;i<12;i++){const p=box(.62,.02,.83,1.3+(i%3)*.15,1.5+i*.09,.2+i*.16,M.paper);p.rotation.z=i*.08;forms.push(p)}
 for(let i=0;i<5;i++){checks.push(ico(.11,-.7+i*.22,3.65,-.45,M.green,scene,0))}
}
function init(){
 renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:false});
 renderer.setSize(W,H,false);renderer.setPixelRatio(1);
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
 document.querySelector('#stage').appendChild(renderer.domElement);
 camera=new THREE.PerspectiveCamera(35,W/H,.1,65);scene=new THREE.Scene();
 room();mil=human();aks=ai();badge=ico(.38,0,3.7,.2,M.brass,scene,0);window.seek(0);
}
const captions=["НОВЫЙ ДИРЕКТОР","СОВЕЩАНИЕ НА СОВЕЩАНИЕ","ЗАРПЛАТА: ОПЫТ","ЗАЯВЛЕНИЕ ПРИНЯТО?","ОТКЛЮЧЕНО","ТВОЯ НОВАЯ ДОЛЖНОСТЬ"];
const tags=["Я НАЧАЛ ПРОСТО С ОДНОЙ ЗАДАЧИ","ИИ ПЕРЕХВАТИЛ УПРАВЛЕНИЕ","ЭКОНОМИЯ ПО-НОВОМУ","ДОКУМЕНТООБОРОТ","ЛОЖНАЯ ПОБЕДА","НОВЫЙ ПАНЧЛАЙН"];
const looks=[
 {p:[.20,3.52,9.1],at:[0,2.74,-.05]},
 {p:[-2.0,3.7,5.6],at:[-1.25,3.06,-.3]},
 {p:[2.48,3.55,5.45],at:[1.16,2.43,.25]},
 {p:[2.52,3.08,5.8],at:[1.58,2.16,.22]},
 {p:[-2.1,2.58,5.85],at:[-1.25,1.90,-.3]},
 {p:[2.28,3.24,5.62],at:[1.38,2.33,.30]}
];
function seek(t){
 clock=t;
 const s=Math.min(5,Math.floor(Math.max(0,t)/6.5)),dt=t-s*6.5;
 document.querySelector('#slogan').textContent=captions[s];
 document.querySelector('#tag').textContent=tags[s];
 for(let i=0;i<6;i++){}
 const L=looks[s],b=Math.sin(t*.8),bob=Math.sin(t*2.6);
 camera.position.set(L.p[0]+Math.sin(dt*.26)*.12,L.p[1]+Math.cos(dt*.3)*.035,L.p[2]-.12*Math.min(6.5,dt));
 camera.lookAt(...L.at); camera.updateProjectionMatrix();
 // deliberate staged action, not a static picture
 mil.head.rotation.z=(s===0?-.10:s===2?.08:s===4?.10:0)+Math.sin(t*3.4)*.035;
 mil.root.rotation.y=s===3?-.14:s===5?.16:0;
 mil.root.position.y=.35+(s===0?.09*Math.max(0,1-dt/3):0);
 aks.root.position.y=(s===4?1.27:2.15)+Math.sin(t*2.2)*.09+(s===0?Math.max(0,1.5-t)*2.2:0);
 aks.root.rotation.y=Math.sin(t*.65)*.16;
 aks.orbit.rotation.y=t*.62;aks.outer.rotation.z=t*.22;
 aks.root.scale.setScalar(s===4?.46:1);
 desk.visible=true;
 coin.visible=s===2;
 coin.position.y=2.6+Math.sin(t*3)*.24;coin.rotation.x=t*1.5;
 printer.visible=s===3;
 meeting.forEach((x,i)=>{x.visible=s===1;x.position.y=2.55+i*.13+Math.sin(t*2+i)*.05});
 forms.forEach((x,i)=>{x.visible=s===3;x.position.y=1.7+i*.09+Math.sin(t*2+i)*.09;x.rotation.y=t*.2+i*.08});
 checks.forEach((x,i)=>{x.visible=s===5;x.scale.setScalar(.7+Math.abs(Math.sin(t*2+i))*.3)});
 phone.visible=s===5;
 socket.visible=s===4;wire.visible=s===4;
 badge.visible=s===0;badge.rotation.y=t*2;badge.position.set(.2,3.75+Math.sin(t*3)*.09,.15);badge.scale.setScalar(s===0?Math.min(1,Math.max(.01,(t-.25)*1.5)):1);
 renderer.render(scene,camera);
}
window.seek=seek;window.ready=true;init();
</script></body></html>
