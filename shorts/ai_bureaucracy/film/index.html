const EASE = { expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), eio, sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x), none: (x) => x };

function shotAt(t) { let s = SH[0]; for (const x of SH) if (t >= x.t) s = x; return s; }
function camAt(t) {
  const s = shotAt(t), lt = t - s.t, k = s.keys;
  let a = k[0], b = k[0], f = 0;
  for (let i = 1; i < k.length; i++) { if (lt <= k[i][0]) { a = k[i - 1]; b = k[i]; f = (lt - a[0]) / Math.max(1e-4, b[0] - a[0]); f = (EASE[b[4]] || eio)(clamp(f)); break; } a = b = k[i]; f = 1; }
  for (let j = 0; j < 3; j++) { v3.setComponent(j, lerp(a[1][j], b[1][j], f)); l3.setComponent(j, lerp(a[2][j], b[2][j], f)); }

}

const blinkAt = (t, seed) => { const p = 2.6 + hash(seed) * 1.6, x = (t + hash(seed + 3) * p) % p; return x < 0.13 ? Math.sin(x / 0.13 * Math.PI) : 0; };

function heroUpdate(t) {
  const p = { L: {}, R: {}, blink: blinkAt(t, 1) };
  // 0–4.6: читает письмо, на «одно слово» поднимает палец
  const finger = prog(t, wd('d01', 7) - 0.15, 0.3) * (1 - prog(t, st('d02') - 0.1, 0.25));
  const grab = prog(t, st('d02'), 0.35), toss = prog(t, wd('d02', 2) - 0.15, 0.25), rel = prog(t, wd('d02', 2) + 0.2, 0.4);
  p.lookY = 0.6; p.lookX = 0; p.brow = 0.3; p.lean = 0.12; p.nod = -0.06;
  if (t < st('d02') + 1.2) {
    p.brow = 0.3 + 0.7 * prog(t, wd('d01', 5) - 0.1, 0.2) * (1 - prog(t, wd('d01', 6), 0.3));
    p.R = { x: lerp(0.15, -2.4, finger), z: lerp(0.12, 0.25, finger), ex: lerp(-0.35, -0.6, finger), point: finger > 0.5 };
    p.L = { x: lerp(0.15, -0.6, 0.6), z: 0.25, ex: -1.3 };
    // бросок письма: правая рука вперёд → вправо
    if (t > st('d02')) {
      p.R = { x: lerp(-0.6, -1.3, grab) + toss * 0.4, y: 0, z: lerp(0.2, 0.2, grab) - toss * 0.9 + rel * 0.6, ex: lerp(-0.6, -0.2, grab) - rel * 0.6 };
      p.lookX = lerp(0, 1, toss); p.turn = lerp(0, 0.35, toss) * (1 - rel * 0.3);
    }
  }
  // Нейра думает: герой откидывается, смотрит вправо
  if (t >= st('d02') + 1.2 && t < cut.meet) {
    const surprise = prog(t, wd('s01', 3) + 0.2, 0.25);
    p.turn = 0.38; p.lookX = 1; p.lookY = 0.3; p.lean = lerp(0.05, -0.12, surprise); p.brow = lerp(0.2, 1, surprise); p.wide = surprise * 0.6; p.mouth = surprise * 0.5;
    p.L = { x: lerp(0.15, -0.5, surprise), z: lerp(0.15, 0.7, surprise), ex: -0.8 }; p.R = { x: lerp(0.15, -0.5, surprise), z: lerp(0.15, 0.7, surprise), ex: -0.8 };
  }
  // ожидание: подбородок на руке, постукивание пальцами
  if (t >= cut.wait && t < cut.chat) {
    const buzz = prog(t, wd('d06', 4) - 0.1, 0.2);
    const pick = prog(t, wd('d06', 6) - 0.05, 0.35);
    p.lean = 0.25 - pick * 0.15; p.nod = 0.1 - buzz * 0.15; p.lookY = -0.3 + buzz * 0.2; p.lookX = -0.6 * buzz; p.brow = buzz * 0.7; p.wide = buzz * 0.5;
    p.L = { x: -1.6, z: 0.35, ex: -1.9 }; p.headTilt = 0.12 * (1 - buzz);
    p.R = { x: -0.5 - pick * 0.7, z: 0.15 + Math.sin(t * 18) * 0.03 * (1 - buzz), ex: -0.9 - pick * 0.4 };
    p.blink = Math.max(p.blink, prog(t, wd('d06', 2) - 0.1, 0.15) * (1 - prog(t, wd('d06', 3) - 0.2, 0.15)) * 0.6);
  }
  // читает сообщение: обе руки держат телефон
  if (t >= cut.chat && t < cut.punch) {
    const wide = prog(t, wd('d07', 8) - 0.1, 0.15);
    p.lean = 0.18; p.nod = 0.28 - wide * 0.3; p.lookY = -0.7 + wide * 0.7; p.lookX = 0; p.brow = 0.2 + wide * 0.9; p.wide = wide * 0.8; p.mouth = wide * 0.75;
    p.L = { x: -1.15, z: 0.05, ex: -1.25 }; p.R = { x: -1.15, z: 0.05, ex: -1.25 };
  }
  // панч: смотрит в камеру, потом толпа — шок; «шеф» — фейспалм
  if (t >= cut.punch) {
    const shock = prog(t, wd('d08', 6) + 0.25, 0.2), palm = prog(t, wd('s05', 5), 0.35);
    p.lean = 0.05; p.lookY = 0.15; p.lookX = 0; p.brow = lerp(-0.2, 1, shock); p.browAng = lerp(0.18, -0.1, shock); p.wide = shock * 0.7 - palm * 0.6; p.mouth = shock * 0.6 * (1 - palm);
    p.nod = palm * 0.25; p.turn = shock * 0.25 * (1 - palm);
    p.L = { x: lerp(-0.5, -0.3, shock), z: lerp(0.15, 0.9, shock) * (1 - palm) + 0.15, ex: -1.0 };
    p.R = { x: lerp(-0.5, -2.2, palm) , z: lerp(0.15, 0.9, shock) * (1 - palm) + palm * -0.15, ex: lerp(-1.0, -2.0, palm) };
    p.blink = Math.max(p.blink, palm);
    if (t > cut.outro) { p.nod = 0.25; }
  }
  hero.pose(p);
}

const ND = { pos: new THREE.Vector3() };
function neuraUpdate(t) {
  // Нейра влетает справа к «Отдаю это нейросети»

  const think = prog(t, wd('s01', 1) - 0.1, 0.2) * (1 - prog(t, wd('s01', 3) - 0.05, 0.2));
  const shake = prog(t, wd('s01', 3) - 0.1, 0.1) * (1 - prog(t, wd('s01', 4) + 0.35, 0.1));
  const gulp = Math.sin(clamp((t - (wd('d02', 2) + 0.25)) / 0.3) * Math.PI);
  neura.body.scale.set(1 + gulp * 0.12, 1 - gulp * 0.1, 1 + gulp * 0.12);
  neura.body.position.x = Math.sin(t * 55) * 0.012 * shake;
  neura.body.rotation.z = Math.sin(t * 40) * 0.05 * shake;
  const tk = svetaNow(t) && t < cut.meet ? talkEnv(t) : 0;
  neura.set({ blink: blinkAt(t, 5), squint: think, happy: prog(t, st('s01'), 0.1) * (1 - prog(t, wd('s01', 1) - 0.1, 0.1)), talk: tk, look: -0.6 * (1 - caught), armR: 0.25 + gulp * 0.6, armL: 0.25 + shake * 1.2 });

  loadRing.visible = think > 0.01;
  // трое агентов вылетают
  trio.forEach((b, i) => {
    const t0 = wd('s01', 4) - 0.05 + i * 0.2, p = clamp((t - t0) / 0.55);
    const shown = t >= t0;

    b.body.scale.set(1 + (1 - land) * 0.25 * (p >= 1), 1 - (1 - land) * 0.25 * (p >= 1), 1);
    b.root.rotation.y = lerp(-1, 0.15 * (i - 1), p);
    b.set({ blink: blinkAt(t, 20 + i), happy: p >= 1 ? 1 : 0, look: (1 - i) * -0.5 });
  });
}

function mailUpdate(t) {

  oBar.style.transform = `scaleX(${eout(prog(t, ti + 0.15, 0.4))})`;
  const b = prog(t, wd('d09', 1) - 0.05, 0.3); oTh.style.opacity = b; oTh.style.transform = `translateY(${(1 - eout(b)) * 30}px)`;
  const q = prog(t, wd('d09', 6), 0.35); oQ.style.opacity = q > 0 ? 1 : 0; oQ.style.transform = `scale(${0.7 + 0.3 * back(q, 2)}) rotate(${(1 - q) * -3}deg)`;
  const s = prog(t, wd('d09', 0) + 0.2, 0.3); oS.style.opacity = s > 0 ? 1 : 0;
  const beat = t > en('d09') ? 1 + 0.05 * Math.exp(-((t - en('d09')) % 0.5) * 8) : 1;
  oS.style.transform = `scale(${(0.6 + 0.4 * back(s, 2.4)) * beat})`;
}

// ============ общий кадр ============
const tl = gsap.timeline({ paused: true });
['hook', 'delegate', 'spawn'].forEach((n, i) => tl.addLabel('scene:' + n, [0, st('d02') - 0.1, st('s01') - 0.05][i]));
tl.addLabel('scene:meeting', cut.meet).addLabel('scene:hr', cut.hr).addLabel('scene:burst', cut.mont).addLabel('scene:send', cut.send)
  .addLabel('scene:wait', cut.wait).addLabel('scene:message', cut.chat).addLabel('scene:punch', cut.punch).addLabel('scene:outro', cut.outro);
tl.to({}, { duration: D }, 0);

// Рендер-бюджет: 2 ядра без GPU — карта окружения стоила ~60 % времени кадра. Заменяем её мягким
// заполняющим светом, а MeshPhysical (clearcoat) → MeshStandard с теми же цветами и шероховатостью.
stage.scene.environment = null;
stage.scene.traverse((o) => {
  if (o.isMesh && o.material && o.material.isMeshPhysicalMaterial) {
    const m = o.material;
    o.material = new THREE.MeshStandardMaterial({ color: m.color, map: m.map, roughness: Math.max(0.22, m.roughness * 0.9), metalness: m.metalness * 0.6, transparent: m.transparent, opacity: m.opacity, side: m.side });
  }
  if (o.isHemisphereLight) o.intensity *= 1.75;
});
let lastSet = null;
OM3.film(stage, tl, D, null, (t) => {
  const c = camAt(t);
  for (const k in SETS) SETS[k].g.visible = k === c.set;
  stage.camera.position.copy(c.pos); stage.camera.lookAt(c.look); stage.camera.fov = c.fov; stage.camera.updateProjectionMatrix();
  if (stage.bokeh) stage.bokeh.uniforms.focus.value = c.pos.distanceTo(c.look);
  hero.root.visible = !((t >= cut.chat && t < cut.face) || (t >= cut.chat2 && t < cut.punch));
  if (c.set === 'A') { heroUpdate(t); neuraUpdate(t); mailUpdate(t); officeEvening(t); phoneUpdate(t); finaleUpdate(t); }
  neura.root.visible = c.set === 'A' && t < cut.meet;
  if (c.set === 'B') meetingUpdate(t);
  if (c.set === 'C') hrUpdate(t);
  if (c.set === 'D') montageUpdate(t);
  if (c.set === 'E') sendUpdate(t);
  capsUpdate(t); platesUpdate(t); hostUpdate(t); outroUpdate(t);
});
OM3.region('hero', hero.root, stage, 'Герой');
OM3.region('neura', neura.root, stage, 'Нейра');

// ============ звук ============
OM.music({ style: 'pizzicato', drop: 'punch', ending: 'button', end: D - 0.3, energy: { hook: 0.55, delegate: 0.55, spawn: 0.65, meeting: 0.6, hr: 0.8, burst: 0.95, send: 0.9, wait: 0.15, message: 0.45, punch: 1, outro: 0.7 } });
const sfx = (n, at, o) => { if (at >= 0) OM.sfx(n, at, o); };
sfx('whoosh', 0.0, { gain: 0.45 }); sfx('pop', 0.42, { gain: 0.5, note: 5 });
sfx('tick', wd('d01', 7) - 0.05, { gain: 0.6 });
sfx('whoosh', wd('d02', 2) - 0.05, { gain: 0.5 }); sfx('pop', wd('d02', 2) + 0.32, { gain: 0.6, note: 1 });
sfx('glitch', wd('s01', 1), { gain: 0.25 });
[0, 1, 2].forEach((i) => { sfx('pop', wd('s01', 4) - 0.05 + i * 0.2, { gain: 0.6, note: 3 + i * 2 }); sfx('boing', wd('s01', 4) + 0.5 + i * 0.2, { gain: 0.3 }); });
sfx('whip', cut.meet, { gain: 0.5 });
sfx('draw', wd('s02', 2) - 0.25, { dur: 0.35, gain: 0.6 }); sfx('draw', wd('s02', 4) - 0.1, { dur: 0.35, gain: 0.6 }); sfx('draw', wd('s02', 6) - 0.05, { dur: 0.45, gain: 0.7 });
sfx('boing', wd('s03', 3) - 0.05, { gain: 0.6 }); [0, 1, 2, 3].forEach((i) => sfx('paper', wd('s03', 4) + 0.3 + i * 0.22, { gain: 0.6 }));
sfx('whip', cut.hr, { gain: 0.5 });
for (let x = cut.hr + 0.1; x < cut.mont - 0.2; x += 1 / 2.3) sfx('stamp', x + 0.1, { gain: 0.35 });
sfx('count', wd('d04', 8) - 0.1, { dur: 1.3, gain: 0.45 });
sfx('riser', cut.mont, { dur: 0.6, gain: 0.35 });
[cut.mont, cut.m2, cut.m3, cut.m4].forEach((x, i) => { sfx('hit', x, { gain: 0.6 }); sfx('stamp', x + 0.05, { gain: 0.45 }); });
sfx('ding', wd('d05', 11), { gain: 0.35, note: 5 });
sfx('whip', cut.send, { gain: 0.45 });
sfx('click', wd('s04', 1) - 0.2, { gain: 0.7 }); sfx('impact', wd('s04', 1) - 0.18, { gain: 0.45 });
sfx('whoosh', wd('s04', 1) - 0.05, { gain: 0.6 }); for (let i = 0; i < 6; i++) sfx('paper', wd('s04', 1) + i * 0.17, { gain: 0.3 });
sfx('whoosh', wd('s04', 2) - 0.35, { gain: 0.4 }); sfx('stamp', wd('s04', 4) - 0.02, { gain: 0.6 });
for (let i = 0; i < 6; i++) sfx('tick', wd('d06', 0) + i * 0.15, { gain: 0.35 });
[0, 1, 2].forEach((i) => sfx('tick', wd('d06', 2) + 0.15 + i * 0.5, { gain: 0.2 }));
[0, 1, 2].forEach((i) => sfx('type', wd('d06', 4) - 0.1 + i * 0.22, { dur: 0.12, gain: 0.4 }));
sfx('ding', st('d07') - 0.05, { gain: 0.5, note: 3 }); sfx('ding', wd('d07', 7) - 0.05, { gain: 0.4, note: 5 }); sfx('ding', wd('d07', 10) - 0.05, { gain: 0.4, note: 1 });
sfx('whip', cut.face, { gain: 0.35 });
sfx('thud', wd('d08', 6) + 0.1, { gain: 0.7 }); sfx('impact', wd('d08', 6) + 0.25, { gain: 0.6 }); sfx('subdrop', wd('d08', 6) + 0.25, { dur: 0.8, gain: 0.5 });
sfx('pop', st('s05') - 0.05, { gain: 0.6, note: 5 });
sfx('slide', wd('s05', 4) - 0.35, { dur: 0.8, gain: 0.3 }); sfx('thud', wd('s05', 4) + 0.5, { gain: 0.6 });
sfx('chime', st('d09'), { gain: 0.45 }); sfx('pop', wd('d09', 6), { gain: 0.5, note: 5 });

window.__timelines['film'] = tl;
</script>
